# flowcase-cp web on the host network: loopback only, API on 127.0.0.1:8280 (also host network).
server {
    listen 127.0.0.1:5280;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8280;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
    location = /healthz { proxy_pass http://127.0.0.1:8280; }
    location = /readyz  { proxy_pass http://127.0.0.1:8280; }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
