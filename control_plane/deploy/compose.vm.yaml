# Development deployment on kibi-vm. Real OIDC (Keycloak) and real sessions/RBAC with an illustrative seed, hence
# APP_ENV=development. Served over HTTPS by the Cloudflare tunnel (CP_BIND_IP=127.0.0.1, https public URLs, so
# cookies are Secure); the insecure-cookie acknowledgement only matters for a plain-HTTP tailnet origin.
# Production refuses the dev seed and development mode (see docs/DEPLOYMENT.md).
name: control-plane

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: control_plane
      POSTGRES_USER: control_plane
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    # Loopback only: the API runs on the host network (to reach loopback-bound mini-app health endpoints).
    ports: ["127.0.0.1:${CP_DB_PORT:-55440}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U control_plane -d control_plane"]
      interval: 3s
      timeout: 3s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION:-26.4.0}
    restart: unless-stopped
    command: ["start", "--import-realm", "--http-enabled=true", "--http-port=8080", "--health-enabled=true",
              "--hostname=${KEYCLOAK_PUBLIC_URL:?set in .env}", "--proxy-headers=xforwarded"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set in .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: kc-bootstrap-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set in .env}
      JAVA_OPTS_APPEND: "-Xms256m -Xmx640m"
    volumes:
      - ${CP_SECRETS_DIR:?set in .env}/realm-workspace.json:/opt/keycloak/data/import/realm-workspace.json:ro
    ports: ["${CP_BIND_IP:?set in .env}:${KEYCLOAK_PORT:-5201}:8080"]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    image: control-plane-api:${CP_RELEASE:-latest}
    build:
      context: .
      dockerfile: Dockerfile.runtime
    restart: unless-stopped
    network_mode: host
    user: "${CP_UID:-65532}:${CP_GID:-65532}"
    environment:
      APP_ENV: development
      COOKIE_INSECURE_DEV_ACKNOWLEDGE: i-understand-cookies-are-not-secure
      DEV_SEED: "true"
      LOG_LEVEL: info
      HTTP_ADDRESS: ${CP_BIND_IP}:${CP_PORT:-5200}
      METRICS_ADDRESS: 127.0.0.1:${CP_METRICS_PORT:-9201}
      PUBLIC_BASE_URL: ${CP_PUBLIC_URL:?set in .env}
      TENANT_KEY: acme-demo
      TENANT_NAME: Example Enterprise
      DATABASE_URL_FILE: /run/secrets/database_url
      OIDC_ISSUER_URL: ${KEYCLOAK_PUBLIC_URL}/realms/workspace
      OIDC_CLIENT_ID: control-plane
      OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
      CSRF_HMAC_KEY_FILE: /run/secrets/csrf_hmac_key
      TOKEN_ENCRYPTION_KEY_FILE: /run/secrets/token_encryption_key
      SERVICE_TOKEN_SIGNING_KEY_FILE: /run/secrets/service_token_signing_key
      TRUSTED_APP_UPSTREAMS_FILE: /run/secrets/trusted_app_upstreams
      # client id -> sha256(secret) + allowed audiences; generated by deploy-vm.sh (plaintext stays in CP_SECRETS_DIR)
      TOKEN_EXCHANGE_CLIENTS_FILE: /run/secrets/token_exchange_clients
    volumes:
      - ${CP_SECRETS_DIR}/database_url:/run/secrets/database_url:ro
      - ${CP_SECRETS_DIR}/oidc_client_secret:/run/secrets/oidc_client_secret:ro
      - ${CP_SECRETS_DIR}/csrf_hmac_key:/run/secrets/csrf_hmac_key:ro
      - ${CP_SECRETS_DIR}/token_encryption_key:/run/secrets/token_encryption_key:ro
      - ${CP_SECRETS_DIR}/service_token_signing_key:/run/secrets/service_token_signing_key:ro
      - ${CP_CONFIG_DIR:?set in .env}/upstreams.json:/run/secrets/trusted_app_upstreams:ro
      - ${CP_CONFIG_DIR}/token_exchange_clients.json:/run/secrets/token_exchange_clients:ro
    depends_on:
      postgres: { condition: service_healthy }
      keycloak: { condition: service_started }

volumes:
  postgres_data:
