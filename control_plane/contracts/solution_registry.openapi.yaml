openapi: 3.1.0
info:
  title: Elenio AI OS solution planning registry
  version: 1.4.0
  description: Workspace-scoped Solution plans, review candidates and delegated development executions. Flowcase remains case, data and domain approval authority. No customer installation or release approval is implied. Cookie session and same-origin CSRF protect writes.
security:
  - session: []
paths:
  /api/v1/solutions/{id}/revisions:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    get:
      summary: Read immutable saved Solution revisions in the current workspace
      description: Requires solution viewing permission. Creation and each successful edit retain a complete snapshot transactionally with audit. No update/delete endpoint exists. Legacy migration retains only the observed current revision and does not invent overwritten earlier versions or editors. Historical read permission is checked on every request. Snapshot checksums are not release signatures or approvals.
      parameters:
        - {name: before, in: query, schema: {type: integer, minimum: 1}, description: Return revisions strictly older than this positive revision number; omit for newest}
      responses:
        '200':
          description: At most 20 snapshots in descending revision order, with no-store caching
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/Revision'}}
                  next_before: {type: integer, minimum: 1}
        '400': {description: Invalid cursor}
        '403': {description: Current workspace membership or viewing permission denied}
        '404': {description: Solution outside current scope or missing}
  /api/v1/solutions/{id}/revisions/{revision}:
    parameters:
      - {$ref: '#/components/parameters/ID'}
      - {name: revision, in: path, required: true, schema: {type: integer, minimum: 1}}
    get:
      summary: Read the exact retained configuration of a saved Solution revision
      responses:
        '200':
          description: Immutable snapshot with checksum ETag; active authorization still required
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Revision'}
        '400': {description: Invalid revision}
        '403': {description: Current workspace access denied}
        '404': {description: Solution or retained revision unavailable in current scope}
  /api/v1/solutions/{id}/executions:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    get:
      summary: Read your own development executions in the active Solution and workspace
      description: Requires solution viewing permission. Each confirmed case is re-read with the current caller identity through the configured trusted Flowcase upstream. Business data and domain authority remain in Flowcase. A denied source read fails the request; no fake empty history is returned.
      parameters:
        - {name: cursor, in: query, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: At most 20 caller-owned associations with authorized current source status; no-store
          content:
            application/json:
              schema:
                type: object
                required: [items, scope]
                properties:
                  scope: {const: current_user_solution_executions}
                  items: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/ExecutionResult'}}
                  next_cursor: {type: string, description: UUID cursor or empty string}
        '403': {description: Current workspace or source case access denied}
        '404': {description: Solution outside current workspace or missing}
        '502': {description: Invalid source case or pin mismatch}
        '503': {description: Trusted source unavailable; no data fabricated}
    post:
      summary: Start a real Flowcase case using a workflow version pinned in the saved Solution
      description: Requires solution author permission, app entitlement and independent Flowcase case creation permission. Stores a durable intent before delegating. Retry the exact original input, revision and request key after a lost response, even after editing the plan. A new input requires a new key and the current revision. Remote idempotency key derives from the persisted intent. Does not publish, approve, install or imply sandboxing of external effects.
      parameters:
        - {$ref: '#/components/parameters/Csrf'}
        - {name: If-Match, in: header, required: true, schema: {type: string, example: '"1"'}}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, pattern: '^[a-zA-Z0-9_-]{8,128}$'}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [workflow_key, title]
              properties:
                workflow_key: {type: string, description: Must be pinned in the saved Solution revision}
                title: {type: string, minLength: 1, maxLength: 300}
                variables: {type: object, description: Original Flowcase input-schema validation applies; at most 256 KiB serialized input}
      responses:
        '200':
          description: Persisted association and freshly authorized current case; repeat returns same intent and case
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExecutionResult'}
        '400': {description: Invalid input, pin or retry key; source input schema may reject variables}
        '403': {description: CSRF, workspace, author, app or independent domain permission denied}
        '404': {description: Solution or pinned source workflow missing}
        '409': {description: Conflicting input for a retry key, or source runtime/dependency conflict}
        '412': {description: New execution requires the latest saved Solution revision}
        '428': {description: Strong saved revision required}
        '502': {description: Source returned a case outside the requested pin}
        '503': {description: Source unavailable; retry unchanged input and key to recover the pending intent}
  /api/v1/solutions/{id}/candidates:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    get:
      summary: List immutable planning candidates in the current solution/workspace
      parameters:
        - {name: cursor, in: query, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Scoped page, at most 50 snapshots; candidates are never approval or install evidence
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, maxItems: 50, items: {$ref: '#/components/schemas/Candidate'}}
                  next_cursor: {type: string, format: uuid}
        '403': {description: Solution access denied}
        '404': {description: Solution outside active workspace or missing}
    post:
      summary: Capture the current plan and fresh server-generated partial readiness as an immutable review candidate
      description: No workflow publication, model probe, release approval or deployment. The server collects evidence; client-supplied evidence/status/scope is rejected. Stable retry replays the original candidate even after a plan edit. A new candidate requires the current strong revision. Snapshot content is immutable; version must be unique in its solution.
      parameters:
        - {$ref: '#/components/parameters/Csrf'}
        - {name: If-Match, in: header, required: true, schema: {type: string, example: '"1"'}}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, pattern: '^[a-zA-Z0-9_-]{8,128}$'}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version]
              properties:
                version: {type: string, maxLength: 32, pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'}
      responses:
        '201':
          description: Captured with transactional audit
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Candidate'}
        '200':
          description: Existing immutable candidate replayed; no duplicate audit
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Candidate'}
        '400': {description: Invalid version/key, unsupported body or evidence beyond supported bounds}
        '403': {description: Author permission, membership or CSRF/Origin denied}
        '404': {description: Solution outside active scope or missing}
        '409': {description: Existing candidate version or conflicting retry key}
        '412': {description: Plan changed during inspection; retain edits and review current revision}
        '428': {description: Current strong plan revision required}
  /api/v1/solutions/{id}/candidates/{candidate_id}:
    parameters:
      - {$ref: '#/components/parameters/ID'}
      - {name: candidate_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      summary: Read an immutable candidate with a checksum ETag
      responses:
        '200':
          description: Scoped candidate; SHA-256 checksum is not a signature, release approval or deployment evidence
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Candidate'}
        '403': {description: Solution access denied}
        '404': {description: Candidate outside active solution/workspace or missing}
  /api/v1/solutions:
    get:
      summary: List up to 50 plans in the server-selected active workspace
      parameters:
        - name: cursor
          in: query
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Scoped page; use next_cursor until absent
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, maxItems: 50, items: {$ref: '#/components/schemas/Project'}}
                  next_cursor: {type: string, format: uuid}
        '401': {description: No verified session}
        '403': {description: solution:view or active membership required}
    post:
      summary: Create a plan with transactional audit and retry deduplication
      parameters:
        - {$ref: '#/components/parameters/Csrf'}
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, pattern: '^[a-zA-Z0-9_-]{8,128}$'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Definition'}
      responses:
        '201': {description: Created; ETag is quoted revision}
        '200': {description: Same request replayed; no duplicate audit event}
        '400': {description: Invalid body or missing retry key}
        '403': {description: solution:author, membership or CSRF/origin denied}
        '409': {description: Solution key already exists or retry key used for another body}
  /api/v1/solutions/{id}:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    get:
      summary: Read one plan in the current workspace
      responses:
        '200':
          description: Plan with strong revision ETag
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
        '403': {description: Workspace access denied}
        '404': {description: Missing or in another workspace/tenant}
    patch:
      summary: Replace planning metadata with optimistic concurrency
      parameters:
        - {$ref: '#/components/parameters/Csrf'}
        - name: If-Match
          in: header
          required: true
          schema: {type: string, example: '"1"'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Definition'}
      responses:
        '200': {description: Updated plan; revision incremented and audit committed atomically}
        '400': {description: Invalid definition or attempted key change}
        '403': {description: Author permission, membership or CSRF/origin denied}
        '404': {description: Missing or in another workspace/tenant}
        '412': {description: Stale revision; caller must preserve edits and review current plan}
        '428': {description: Exact strong revision If-Match required}
  /api/v1/solutions/{id}/readiness:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    get:
      summary: Inspect pinned workflow publication through the authorized trusted upstream
      description: Read-only, 15-second overall deadline. No redirect, environment proxy, body-supplied URL, raw provider output, model call or publication. Result is revision/time scoped. Transitive dependencies, business UI, solution approval and target deployment remain unverified; release_ready is false.
      responses:
        '200':
          description: Partial dependency evidence with explicit remaining blockers
          content:
            application/json:
              schema:
                type: object
                required: [solution_id, revision, checked_at, workflows, blockers, release_ready]
                properties:
                  solution_id: {type: string, format: uuid}
                  revision: {type: integer, minimum: 1}
                  checked_at: {type: string, format: date-time}
                  release_ready: {const: false}
                  blockers: {type: array, items: {type: string}}
                  application_issues: {type: array, items: {type: string}}
                  agent_releases:
                    type: array
                    maxItems: 20
                    description: Deduplicated current source observations per trusted runtime agent/version pin; at most 64 KiB of retained Agent metadata and 180 KiB aggregate readiness. Unavailable, unauthorized or over-limit facts remain explicit. No provider call or solution approval.
                    items: {$ref: '#/components/schemas/AgentReleaseObservation'}
                  workflows:
                    type: array
                    items:
                      type: object
                      required: [key, version, state, reason]
                      properties:
                        key: {type: string}
                        version: {type: integer, minimum: 1}
                        state: {enum: [blocked, verified]}
                        reason: {type: string}
                        definition_hash: {type: string, pattern: '^[0-9a-f]{64}$'}
                        inventory_complete: {type: boolean, description: Direct reference discovery only; never transitive approval or release readiness}
                        binding_reason: {type: string}
                        binding_snapshot: {$ref: '#/components/schemas/BindingSnapshot'}
                        resources:
                          type: array
                          maxItems: 200
                          description: At most 200 references across the report; overflow is blocked explicitly. Config values, instructions, endpoint URLs and customer payloads are excluded.
                          items:
                            type: object
                            required: [kind, ref, state, reason]
                            properties:
                              kind: {type: string}
                              ref: {type: string, maxLength: 128}
                              version: {type: string, maxLength: 128}
                              node_id: {type: string, maxLength: 128}
                              state: {const: blocked}
                              reason: {type: string}
        '403': {description: Solution access denied}
        '404': {description: Solution missing or outside current scope}
components:
  securitySchemes:
    session: {type: apiKey, in: cookie, name: __Host-cp_session}
  parameters:
    ID: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    Csrf: {name: X-CSRF-Token, in: header, required: true, schema: {type: string}}
  schemas:
    AgentReleaseObservation:
      type: object
      required: [runtime_agent_id, expected_version, reason]
      properties:
        runtime_agent_id: {type: string, maxLength: 128}
        expected_version: {type: string, maxLength: 128}
        reason: {type: string}
        evidence: {$ref: '#/components/schemas/AgentReleaseEvidence'}
    AgentReleaseEvidence:
      type: object
      description: Metadata from the original human release.read Agent source, validated against exact runtime/version binding, fresh observation and canonical checksum. No prompts, schemas, scope values, endpoints or credentials. Historical candidate/list/replay reads require current Agent app access and original source release.read independently of CP planning rights; metadata is not redacted under an unchanged checksum. Source unavailability fails closed. Source verified does not grant Solution approval or install authority.
      required: [schema, agent_key, environment, release_id, agent_version, fingerprint, evaluation_gate, independent_approval, self_approval_exempt, evaluation_primary_config_matches, skills, tools, blockers, state, content_hash, observed_at]
      properties:
        schema: {const: elenio.agent-release-evidence.v1}
        agent_key: {type: string}
        environment: {enum: [staging, production]}
        release_id: {type: string, format: uuid}
        agent_version: {$ref: '#/components/schemas/SourceDependencyPin'}
        fingerprint: {type: string}
        request_id: {type: string, format: uuid}
        evaluation_id: {type: string, format: uuid}
        evaluation_gate: {enum: ["", pass, blocked]}
        independent_approval: {type: boolean}
        self_approval_exempt: {type: boolean}
        evaluation_primary_config_matches: {type: boolean}
        primary_model: {$ref: '#/components/schemas/SourceModelPin'}
        fallback_model: {$ref: '#/components/schemas/SourceModelPin'}
        skills: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/SourceDependencyPin'}}
        tools: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/SourceDependencyPin'}}
        blockers: {type: array, maxItems: 30, items: {type: string, pattern: '^[a-z][a-z0-9_]{0,95}$'}}
        state: {enum: [verified, blocked]}
        content_hash: {type: string, pattern: '^[0-9a-f]{64}$'}
        observed_at: {type: string, format: date-time}
    SourceDependencyPin:
      type: object
      required: [id, version, checksum, state]
      properties:
        id: {type: string, format: uuid}
        version: {type: string, maxLength: 40}
        checksum: {type: string}
        state: {type: string}
        scope_hash: {type: string}
    SourceModelPin:
      type: object
      required: [id, config_version, approved]
      properties:
        id: {type: string, format: uuid}
        config_version: {type: integer, minimum: 1}
        approved: {type: boolean}
    BindingSnapshot:
      type: object
      description: Fresh authorized source catalog metadata observed for this exact published workflow. Snapshot checksum validated server-side; exact refs/kinds/node IDs, bounded count and freshness checked. Not a transitive release, policy authority, signature or installation. At most 200 source bindings across a report, within the direct resource limit. Historical candidates retain original observation time and digest.
      required: [schema, workflow_key, version, definition_hash, content_hash, observed_at, bindings]
      properties:
        schema: {const: elenio.workflow-bindings.v1}
        workflow_key: {type: string}
        version: {type: integer, minimum: 1}
        definition_hash: {type: string, pattern: '^[0-9a-f]{64}$'}
        content_hash: {type: string, pattern: '^[0-9a-f]{64}$'}
        observed_at: {type: string, format: date-time}
        bindings:
          type: array
          maxItems: 200
          items:
            type: object
            required: [kind, ref, node_id, registered]
            properties:
              kind: {enum: [agent, approval_policy, connector, assignee_role]}
              ref: {type: string, maxLength: 128}
              node_id: {type: string, maxLength: 128}
              registered: {const: true}
              runtime_agent_id: {type: string, maxLength: 128}
              skill_version: {type: string, maxLength: 128}
              input_contract: {enum: [sim.v1, flowcase.case.v1]}
              operation: {type: string, maxLength: 128}
              provisional: {type: boolean}
              sod: {type: array, maxItems: 2, items: {enum: [not_case_owner, not_task_submitter]}}
    Revision:
      type: object
      required: [plan, content_hash, origin, recorded_at]
      properties:
        plan: {$ref: '#/components/schemas/Project'}
        content_hash: {type: string, pattern: '^[0-9a-f]{64}$', description: SHA-256 of canonical wire plan JSON; checksum only}
        origin: {enum: [write, migration_current]}
        recorded_by: {type: string, format: uuid, description: Verified saving actor for authored revisions; omitted for legacy backfill}
        recorded_at: {type: string, format: date-time, description: Retention time; legacy backfill does not claim the original editor/time}
    ExecutionResult:
      type: object
      required: [execution]
      properties:
        execution:
          type: object
          required: [id, solution_id, plan_revision, workflow_key, workflow_version, created_at]
          properties:
            id: {type: string, format: uuid}
            solution_id: {type: string, format: uuid}
            plan_revision: {type: integer, minimum: 1}
            workflow_key: {type: string}
            workflow_version: {type: integer, minimum: 1}
            case_id: {type: string, format: uuid, description: Absent until a source case has been confirmed}
            created_at: {type: string, format: date-time}
        case:
          type: object
          description: Authorized source summary, omitted for pending intents; variables and evidence are not copied into Control Plane
          required: [id, reference, title, status, workflow_key, workflow_version, definition_hash]
          properties:
            id: {type: string, format: uuid}
            reference: {type: string}
            title: {type: string}
            status: {type: string}
            workflow_key: {type: string}
            workflow_version: {type: integer, minimum: 1}
            definition_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
    Candidate:
      type: object
      required: [id, solution_id, version, plan_revision, status, snapshot, content_hash, created_at]
      properties:
        id: {type: string, format: uuid}
        solution_id: {type: string, format: uuid}
        version: {type: string}
        plan_revision: {type: integer, minimum: 1}
        status: {const: candidate}
        content_hash: {type: string, pattern: '^[0-9a-f]{64}$', description: SHA-256 of canonical snapshot JSON with exact numeric precision; not a signature or approval}
        created_at: {type: string, format: date-time}
        snapshot:
          type: object
          required: [schema_version, plan, readiness, limitations]
          properties:
            schema_version: {const: elenio.solution-candidate.v1}
            plan: {$ref: '#/components/schemas/Project'}
            readiness: {$ref: '#/paths/~1api~1v1~1solutions~1{id}~1readiness/get/responses/200/content/application~1json/schema'}
            limitations: {type: array, items: {type: string}}
    Definition:
      type: object
      additionalProperties: false
      required: [key, name, delivery_mode, output]
      properties:
        key: {type: string, pattern: '^[a-z][a-z0-9-]{1,62}$'}
        name: {type: string, minLength: 2, maxLength: 120}
        description: {type: string, description: At most 12000 UTF-8 bytes}
        delivery_mode: {enum: [internal, solution, enterprise]}
        output: {enum: [business_ui, api, both]}
        application:
          type: object
          additionalProperties: false
          required: [title, pages]
          description: Optional for incomplete legacy plans; rejected for API-only output. Declarative preview composition, not executable HTML or an installed app.
          properties:
            title: {type: string, minLength: 2, maxLength: 120}
            pages:
              type: array
              minItems: 1
              maxItems: 12
              items:
                type: object
                additionalProperties: false
                required: [key, title, kind]
                properties:
                  key: {type: string, pattern: '^[a-z][a-z0-9-]{1,62}$'}
                  title: {type: string, minLength: 2, maxLength: 80}
                  kind: {enum: [overview, intake, tasks, report]}
                  workflow_key: {type: string, description: Must reference a pinned plan workflow; required except for overview}
        workflows:
          type: array
          maxItems: 100
          description: Unique workflow keys, one pinned positive version per key; no readiness or grant implied
          items:
            type: object
            additionalProperties: false
            required: [key, version]
            properties:
              key: {type: string, pattern: '^[a-z][a-z0-9-]{0,62}$'}
              version: {type: integer, minimum: 1}
    Project:
      type: object
      required: [id, tenant_id, workspace_id, revision, definition, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        tenant_id: {type: string, format: uuid}
        workspace_id: {type: string, format: uuid}
        revision: {type: integer, minimum: 1}
        definition: {$ref: '#/components/schemas/Definition'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
