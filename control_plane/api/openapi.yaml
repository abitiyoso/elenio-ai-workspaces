  /api/v1/solutions/{id}/candidates:
    $ref: '../contracts/solution_registry.openapi.yaml#/paths/~1api~1v1~1solutions~1{id}~1candidates'
  /api/v1/solutions/{id}/candidates/{candidate_id}:
    $ref: '../contracts/solution_registry.openapi.yaml#/paths/~1api~1v1~1solutions~1{id}~1candidates~1{candidate_id}'
  /api/v1/solutions:
    $ref: '../contracts/solution_registry.openapi.yaml#/paths/~1api~1v1~1solutions'
  /api/v1/solutions/{id}:
    $ref: '../contracts/solution_registry.openapi.yaml#/paths/~1api~1v1~1solutions~1{id}'
  /api/v1/solutions/{id}/readiness:
    $ref: '../contracts/solution_registry.openapi.yaml#/paths/~1api~1v1~1solutions~1{id}~1readiness'
  /healthz:
    get:
      tags:
      - Platform
      summary: Liveness
      security: []
      responses:
        '200':
          description: ok
  /readyz:
    get:
      tags:
      - Platform
      summary: Readiness (database, migrations; IdP reported as degraded)
      security: []
      responses:
        '200':
          description: ready
        '503':
          description: not ready
  /.well-known/jwks.json:
    get:
      tags:
      - Platform
      summary: Public ES256 keys for audience-bound service tokens
      security: []
      responses:
        '200':
          description: JWKS
  /auth/login:
    get:
      tags:
      - Session
      summary: Start OIDC authorization code + PKCE S256 (302 to IdP)
      security: []
      parameters:
      - name: return_to
        in: query
        schema:
          type: string
        description: same-origin relative path; anything else is ignored
      responses:
        '302':
          description: redirect to IdP
        '503':
          description: IdP unavailable
        '429': &id001
          $ref: '#/components/responses/Error'
  /auth/callback:
    get:
      tags:
      - Session
      summary: IdP redirect target; validates state/binding/iss, exchanges code, verifies ID token
      security: []
      responses:
        '302':
          description: to return_to, or /signed-out?error=<code>
  /auth/logout:
    post:
      tags:
      - Session
      summary: Revoke session, revoke refresh token at IdP, return end-session URL
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  redirect:
                    type: string
        '401': *id001
        '403': *id001
        '429': *id001
      parameters:
      - $ref: '#/components/parameters/Csrf'
  /api/v1/me:
    get:
      tags:
