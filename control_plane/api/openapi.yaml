      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: *id002
  /api/v1/admin/apps/{key}/enable:
    post:
      tags:
      - Administration
      summary: Re-enable published version
      responses:
        '200':
          description: OK
        '401': *id001
        '403': *id001
        '429': *id001
        '412': *id001
        '428': *id001
        '400': *id001
        '422': *id001
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/Csrf'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: *id002
  /api/v1/admin/audit:
    get:
      tags:
      - Administration
      summary: Redacted audit events, newest first, cursor pagination
      responses:
        '200':
          description: OK
        '401': *id001
        '403': *id001
        '429': *id001
      parameters:
      - name: cursor
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: string
      - name: action
        in: query
        schema:
          type: string
      - name: actor_user_id
        in: query
        schema:
          type: string
      - name: workspace_id
        in: query
        schema:
          type: string
  /api/v1/admin/integrations:
    get:
      tags:
      - Administration
      summary: IdP, session, token and adapter metadata (no secrets)
      responses:
        '200':
          description: OK
        '401': *id001
        '403': *id001
        '429': *id001
  /api/v1/token-exchange:
    post:
      tags:
      - Platform
      summary: Delegated token exchange for experience-app BFFs (server-to-server, ADR-004)
      description: 'Not cookie-authenticated (no CSRF/Origin). Client auth is HTTP Basic with a client from TOKEN_EXCHANGE_CLIENTS.
        The subject token must be a CP token minted for the client (aud = client_id) with a live session; the user must be able
        to open both the client app and the target app in the active workspace. Issues a <= 5 min token for the target audience
        with the same subject/session/workspace and act.sub = app:<client_id>. Every attempt is audited (token.exchanged /
        token.exchange_denied).'
      security:
      - exchangeClient: []
      parameters:
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
        description: correlation id copied into the issued token and the audit event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenExchangeRequest'
      responses:
        '200':
          description: issued
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenExchangeResponse'
        '400':
          description: INVALID_REQUEST
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: INVALID_CLIENT, INVALID_SUBJECT_TOKEN, SUBJECT_TOKEN_AUDIENCE_MISMATCH, SUBJECT_TOKEN_DELEGATED, SUBJECT_NOT_HUMAN,
            SESSION_INACTIVE, SESSION_WORKSPACE_CHANGED, SUBJECT_INACTIVE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: AUDIENCE_NOT_ALLOWED, AUDIENCE_NOT_CONFIGURED, CLIENT_APP_DENIED, TARGET_APP_DENIED (message carries the policy
            reason code)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          $ref: '#/components/responses/Error'
  /apps/{app_key}/{path}:
    get:
      tags:
      - Applications
      summary: Authorised same-origin mini-app route (302 login / 403 / 503 pending / proxied)
      parameters:
      - name: app_key
        in: path
        required: true
        schema:
          type: string
      - name: path
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: proxied
        '302':
          description: login
        '403':
          description: denied
        '503':
          description: integration pending
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-cp_session
    exchangeClient:
      type: http
      scheme: basic
      description: token-exchange client id and secret from deployment config (TOKEN_EXCHANGE_CLIENTS stores sha256 of the secret)
  parameters:
    Csrf:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
      description: '"<revision>"'
  responses:
    Error:
      description: Structured error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    ApiError:
      type: object
      required:
      - code
      - message
      - trace_id
      properties:
        code:
          type: string
        message:
          type: string
        trace_id:
          type: string
        issues:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
    TokenExchangeRequest:
      type: object
      additionalProperties: false
      required:
      - subject_token
      - audience
      properties:
        subject_token:
          type: string
          description: CP-issued JWT the client received through /apps/<client_id>/ (aud = client_id)
        audience:
          type: string
          description: target app key from the client's allowlist, e.g. flowcase
        grant_type:
          type: string
          const: urn:ietf:params:oauth:grant-type:token-exchange
        subject_token_type:
          type: string
          enum:
          - urn:ietf:params:oauth:token-type:jwt
          - urn:ietf:params:oauth:token-type:access_token
        requested_token_type:
          type: string
          const: urn:ietf:params:oauth:token-type:jwt
    TokenExchangeResponse:
      type: object
      required:
      - access_token
      - token_type
      - expires_in
      - issued_token_type
      properties:
        access_token:
          type: string
          description: ES256 JWT, aud = target audience, act = {sub = app:<client_id>}
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          maximum: 300
        issued_token_type:
          type: string
          const: urn:ietf:params:oauth:token-type:jwt
    Workspace:
      type: object
      required:
      - id
      - key
      - name
      - status
      properties:
        id:
          type: string
        key:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          type: string
        member_count:
          type: integer
    AppSummary:
      type: object
      required:
      - app_key
      - display_name
      - route_base
      - version
      - integration
      properties:
        app_key:
          type: string
        display_name:
          type: string
        description:
          type: string
        category:
          type: string
        icon:
          type: string
        owner_team:
          type: string
        route_base:
          type: string
        version:
          type: string
        status:
          type: string
        integration:
          enum:
          - proxy
          - pending
        health:
          type: object
    Me:
      type: object
      required:
      - user
      - tenant
      - workspaces
      - apps
      - csrf_token
      - capabilities
      properties:
        user:
          type: object
        tenant:
          type: object
        workspace:
          oneOf:
          - $ref: '#/components/schemas/Workspace'
          - type: 'null'
        workspaces:
          type: array
          items:
            $ref: '#/components/schemas/Workspace'
        apps:
          type: array
          items:
            $ref: '#/components/schemas/AppSummary'
        permissions:
          type: array
          items:
            type: string
        capabilities:
          type: object
        csrf_token:
          type: string
        session:
          type: object
        environment:
          enum:
          - development
          - production
        policy_version:
          type: string
    DirectoryUser:
      type: object
      properties:
        id:
          type: string
        display_name:
          type: string
        email:
          type:
          - string
          - 'null'
        idp_issuer:
          type: string
        idp_subject:
          type: string
        status:
          type: string
        tenant_roles:
          type: array
        memberships:
          type: array
    GrantResult:
      type: object
      required:
      - outcome
      properties:
        outcome:
          enum:
          - granted
          - pending_approval
        binding:
          type: object
        request:
          type: object
