# Generated from the implemented routes (internal/http/server.go). Keep in sync when routes change.
openapi: 3.1.0
info:
  title: AI Workspace Control Plane API
  version: 1.0.0
  description: 'Implemented BFF contract. Cookie session + CSRF (X-CSRF-Token) + same-origin Origin for every unsafe method. Wire types: web/src/api/types.ts.'
servers:
- url: /
security:
- session: []
paths:
  /api/v1/solutions/{id}/revisions:
    $ref: '../contracts/solution_registry.openapi.yaml#/paths/~1api~1v1~1solutions~1{id}~1revisions'
  /api/v1/solutions/{id}/revisions/{revision}:
