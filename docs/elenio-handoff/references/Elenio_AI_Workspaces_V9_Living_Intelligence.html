function metricChartSVG(values, labels, colorA='#1a7bf6', colorB='#6be0ff'){ const max=Math.max(...values,1), w=420, h=160, p=20; const step=(w-p*2)/(values.length-1||1); const pts=values.map((v,i)=>`${p+i*step},${h-p-(v/max)*(h-p*2)}`); const area=`${p},${h-p} `+pts.join(' ')+` ${w-p},${h-p}`; return `<svg class="chart-svg" viewBox="0 0 ${w} ${h}" aria-hidden="true"><defs><linearGradient id="gradLine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="${colorA}"/><stop offset="1" stop-color="${colorB}"/></linearGradient><linearGradient id="gradArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${colorA}" stop-opacity=".26"/><stop offset="1" stop-color="${colorB}" stop-opacity=".03"/></linearGradient></defs>${[0,1,2,3].map(i=>`<line x1="${p}" y1="${p+i*(h-p*2)/3}" x2="${w-p}" y2="${p+i*(h-p*2)/3}" stroke="#dbe8f7" stroke-dasharray="4 5"/>`).join('')}<polygon points="${area}" fill="url(#gradArea)"/><polyline points="${pts.join(' ')}" fill="none" stroke="url(#gradLine)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>${pts.map((pt,i)=>{const [x,y]=pt.split(','); return `<circle cx="${x}" cy="${y}" r="5" fill="#fff" stroke="${i===values.length-1?colorB:colorA}" stroke-width="3"/>`;}).join('')}${labels.map((l,i)=>`<text x="${p+i*step}" y="${h-2}" font-size="9" fill="#8aa0bc" text-anchor="middle">${esc(l)}</text>`).join('')}</svg>`; }
function barsSVG(values, labels){ const max=Math.max(...values,1), w=420, h=160, bw=42, gap=18, left=24, base=h-24; return `<svg class="chart-svg" viewBox="0 0 ${w} ${h}" aria-hidden="true"><defs><linearGradient id="barGrad" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#1f7cf7"/><stop offset="1" stop-color="#6ce1ff"/></linearGradient></defs><line x1="20" y1="${base}" x2="${w-10}" y2="${base}" stroke="#dbe7f6"/>${values.map((v,i)=>{const bh=(v/max)*104, x=left+i*(bw+gap), y=base-bh; return `<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="12" fill="url(#barGrad)"/><text x="${x+bw/2}" y="${y-6}" text-anchor="middle" font-size="10" fill="#55779e">${v}</text><text x="${x+bw/2}" y="${base+14}" text-anchor="middle" font-size="9" fill="#8aa0bc">${esc(labels[i])}</text>`}).join('')}</svg>`; }

function handleIntent(action){const el=action.target.closest('[data-action]');if(!el)return;const k=el.dataset.action;const id=el.dataset.id;switch(k){case 'goto':go(id);break;case 'start':{const prompt=document.querySelector('#heroPrompt')?.value?.trim()||'';startArchitect(prompt,prompt?'':(id||'vendor'));break;}case 'sample':document.querySelector('#heroPrompt').value=scenarios[id].request;document.querySelector('#heroPrompt').focus();break;case 'new':state.modal='new-solution';render();break;case 'new-template':state.modal='import-template';render();break;case 'blank':createBlank();break;case 'template':{const tm=TEMPLATES.find(x=>x.id===id)||state.imported.find(x=>x.id===id);startArchitect(scenarios[id]?.request||`Create a ${tm?.title||id.replaceAll('-',' ')} business workflow with approvals and enterprise integrations.`,scenarios[id]?id:'generic',tm?.title||'Imported Workflow');break;}case 'select-project':state.selectedProject=id;state.scenario=id;resetNodes();state.projectTab='Overview';go('project');break;case 'project-tab':state.projectTab=id;render();break;case 'build':state.hasBlueprint=true;resetNodes();go('studio');toast('Workflow canvas generated from the blueprint (concept simulation).');break;case 'select-node':state.selectedNode=id;render();break;case 'node-add':state.modal='add-node';render();break;case 'test':runTest();break;case 'select-agent':state.selectedAgent=Number(id);render();break;case 'agent-new':state.modal='new-agent';render();break;case 'agent-play':state.modal='agent-test';render();break;case 'skill-toggle':{const a=state.agents[state.selectedAgent];let added=false;if(a){added=!a.skills.includes(id);a.skills=added?[...a.skills,id]:a.skills.filter(x=>x!==id)}render();toast(added?'Skill added to selected agent draft.':'Skill removed from selected agent draft.');break;}case 'collection-new':state.modal='new-collection';render();break;case 'knowledge-upload':document.querySelector('#localKnowledgeInput')?.click();break;case 'connector-new':state.modal='new-connector';render();break;case 'connector-config':state.modal='connector-'+id;render();break;case 'template-filter':state.templateFilter=id;render();break;case 'template-search':break;case 'deploy-target':state.deployTarget=id;render();break;case 'release':prepareRelease();break;case 'manifest':downloadManifest();break;case 'approve':state.opsApproved=true;state.modal=null;toast('Sample task approved locally. No production action was taken.');render();break;case 'review-approval':state.modal='review-approval';render();break;case 'reject':state.opsApproved=true;state.modal=null;toast('Sample task rejected locally. No production action was taken.');render();break;case 'retry':toast('Sample run queued for retry in this interactive concept.');break;case 'command':state.command=true;render();document.querySelector('#commandInput')?.focus();break;case 'modal-close':state.modal=null;state.command=false;render();break;case 'mobile':state.mobile=!state.mobile;render();break;case 'architect-quick':if(id==='build'){state.hasBlueprint=true;resetNodes();go('studio')}else{state.chat.push({role:'user',text:id==='approval'?'Include a mandatory human approval stage.':id==='local'?'Use a customer-hosted model where possible.':'Reuse existing company assets where possible.'});state.chat.push({role:'ai',text:id==='approval'?'Added a mandatory human approval gate before any final system action.':id==='local'?'Noted. Customer-hosted model configuration will be included as a deployment dependency.':'The blueprint now prioritizes capabilities already available in the organization registry.'});render()};break;case 'modal-submit':submitModal();break;case 'copy':navigator.clipboard?.writeText(id).then(()=>toast('Copied to clipboard')).catch(()=>toast('Copy unavailable in this browser'));break;case 'setting':toast('Configuration panel is represented in this product concept.');break;case 'open-file':document.querySelector('#templateFileInput')?.click();break;default:break}}

function runTest(){if(state.test.running)return;state.test={running:true,step:0,fail:state.test.fail,history:[]};go('testing');const fail=state.test.fail;const steps=scenarios[state.scenario].process;steps.forEach((label,i)=>setTimeout(()=>{if(fail&&i>3)return;state.test.step=i+1;state.test.history.push({label,failed:fail&&i===3,time:new Date().toLocaleTimeString()});if(fail&&i===3){state.test.running=false;render();toast('Simulated exception detected; check the execution trace.');return}if(i===steps.length-1){state.test.running=false;toast('Simulation completed across all workflow stages.')}if(!(fail&&i>3))render()},(i+1)*570))}

function topbar(){const pageName={home:'Home',architect:'AI Architect',projects:'Projects',project:scenarios[state.selectedProject].name,studio:'Workflow Studio',agents:'Agent Studio',templates:'Template Repository',knowledge:'Knowledge Hub',integrations:'Integration Hub',testing:'Testing Studio',deploy:'Deployments',operations:'Operations',settings:'Control Center'};return `<header class="topbar"><button class="icon-btn mobile-menu" data-action="mobile" aria-label="Open navigation">${ic('menu')}</button><div class="breadcrumbs"><span>Workspace</span>${ic('chevron',13)}<strong>${esc(pageName[state.page]||'Home')}</strong></div><div class="top-actions"><button class="search-trigger" data-action="command">${ic('search',15)}<span>Search anything...</span><span class="kbd">⌘ K</span></button><span class="pill blue hide-mobile"><span class="dot"></span> Local prototype</span></div></header>`}
function pageView(){switch(state.page){case 'architect':return architectPage();case 'projects':return projectsPage();case 'project':return projectPage();case 'studio':return studioPage();case 'agents':return agentsPage();case 'templates':return templatesPage();case 'knowledge':return knowledgePage();case 'integrations':return integrationsPage();case 'testing':return testingPage();case 'deploy':return deployPage();case 'operations':return operationsPage();case 'settings':return settingsPage();default:return homePage()}}
function homePage(){return `<main class="page"><section class="home-hero"><div class="hero-copy"><div class="eyebrow"><i></i> THE INTELLIGENT SOLUTION ENGINEERING PLATFORM</div><h1 class="hero-title">Your next AI system<br/>starts with <span>a thought.</span></h1><p>Describe a business challenge. Architect workflows, orchestrate intelligent agents, connect enterprise systems and deploy wherever your business runs.</p><div class="hero-composer"><textarea id="heroPrompt" aria-label="Describe business workflow" placeholder="Describe what you want to automate..."></textarea><div class="composer-bottom"><div class="composer-hints">${ic('spark',14)} Powered by AI Architect</div><button class="btn primary" data-action="start" data-id="vendor">Create with AI ${ic('arrow',15)}</button></div></div><div class="example-row"><button class="suggest-chip" data-action="sample" data-id="vendor">${ic('zap',12)} Vendor payment</button><button class="suggest-chip" data-action="sample" data-id="recruitment">${ic('users',12)} Recruitment</button><button class="suggest-chip" data-action="sample" data-id="contract">${ic('file',12)} Contract review</button></div></div><div class="hero-art"><div class="art-light"></div><div class="art-halo"></div><div class="halo2"></div><div class="art-core"><img src="${assets.icon}" alt="Elenio symbol"/></div><div class="orbit-chip orbit-a">${ic('bot',16)} Agent orchestration</div><div class="orbit-chip orbit-b">${ic('workflow',16)} Workflows</div><div class="orbit-chip orbit-c">${ic('database',16)} Enterprise knowledge</div><div class="orbit-chip orbit-d">${ic('plug',16)} API & MCP</div></div></section><div class="spacer" style="height:37px"></div><div class="section-title"><div><h2>Choose how you want to create</h2><p>Multiple ways to begin. One connected engineering workspace.</p></div><button class="linkbtn" data-action="goto" data-id="projects">View projects ${ic('arrow',14)}</button></div><section class="start-grid"><div class="start-card" data-action="start" data-id="vendor" role="button" tabindex="0"><div class="icon-hold">${ic('spark',23)}</div><span class="arrow-small">${ic('arrow',16)}</span><strong>Architect with AI</strong><p>Start with your business requirement and turn it into an executable solution blueprint.</p></div><div class="start-card" data-action="blank" role="button" tabindex="0"><div class="icon-hold">${ic('workflow',23)}</div><span class="arrow-small">${ic('arrow',16)}</span><strong>Build from canvas</strong><p>Compose workflows, reasoning agents, approvals and enterprise integrations manually.</p></div><div class="start-card" data-action="goto" data-id="templates" role="button" tabindex="0"><div class="icon-hold">${ic('layers',23)}</div><span class="arrow-small">${ic('arrow',16)}</span><strong>Start from a template</strong><p>Reuse proven capabilities and adapt them to a new client or business process.</p></div></section><div class="spacer" style="height:32px"></div><section class="visual-grid"><article class="visual-card dark"><div class="meta"><div><span class="pill navy">AI ORCHESTRATION MAP</span><h3 style="color:#fff;margin-top:10px">Agents, tools and approvals in one visual layer</h3><p>A futuristic overview of how Elenio Workspaces turns business requests into governed automation.</p></div></div>${solutionTopologyHTML(scenarios.vendor)}<div class="mini-legend"><span><i style="background:#1285ff"></i> AI agents</span><span><i style="background:#39cbff"></i> Integrations</span><span><i style="background:#2cc897"></i> Human controls</span></div></article><article class="visual-card"><div class="meta"><div><span class="pill blue">WORKSPACE MOMENTUM</span><h3>Engineering throughput snapshot</h3><p>Illustrative performance indicators for product storytelling.</p></div><span class="pill">Concept data</span></div>${metricChartSVG([16,24,28,34,41,48],['W1','W2','W3','W4','W5','W6'])}<div class="metric-strip"><div class="metric-tile"><strong>48</strong><span>Workflow revisions</span></div><div function projectPage(){const s=scenarios[state.selectedProject];const tabs=['Overview','Workflow','Agents & Skills','Knowledge & Integrations','Test','Deploy','Runs'];const route={'Workflow':'studio','Agents & Skills':'agents','Knowledge & Integrations':'knowledge','Test':'testing','Deploy':'deploy','Runs':'operations'};return `<main class="page"><div class="page-head"><div><div class="eyebrow"><i></i> SOLUTION WORKSPACE / ${esc(state.selectedProject.toUpperCase())}</div><h1>${esc(s.name)}</h1><p>${esc(s.short)} · Version 0.1 concept · customer-hostable target.</p></div><div class="head-buttons"><button class="btn ghost small" data-action="goto" data-id="architect">${ic('spark',14)} Refine with AI</button><button class="btn primary small" data-action="goto" data-id="studio">Open builder ${ic('arrow',14)}</button></div></div><div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:22px">${tabs.map(t=>`<button class="filter-btn ${state.projectTab===t?'active':''}" data-action="project-tab" data-id="${t}">${t}</button>`).join('')}</div>${state.projectTab==='Overview'?`<div class="stat-grid"><div class="stat"><div class="stat-label">${ic('workflow',15)} Workflow stages</div><strong>${s.process.length}</strong><small>Illustrative process</small></div><div class="stat"><div class="stat-label">${ic('bot',15)} AI agents</div><strong>${s.agents.length}</strong><small>Recommended</small></div><div class="stat"><div class="stat-label">${ic('plug',15)} Integrations</div><strong>${s.integrations.length}</strong><small>Awaiting configuration</small></div><div class="stat"><div class="stat-label">${ic('shield',15)} Governance</div><strong>01</strong><small>Human approval gate</small></div></div><div class="visual-grid"><section class="visual-card"><div class="meta"><div><span class="pill blue">SOLUTION TOPOLOGY</span><h3 style="margin-top:10px">How this solution is composed</h3><p>Agent orchestration, governed knowledge and enterprise connections visualized as one working system.</p></div><button class="linkbtn" data-action="goto" data-id="studio">Open canvas ${ic('arrow',13)}</button></div>${solutionTopologyHTML(s)}<div class="mini-legend"><span><i style="background:#0f77f8"></i> Workflow</span><span><i style="background:#31c8ff"></i> AI reasoning</span><span><i style="background:#24bf97"></i> Human control</span></div></section><aside class="visual-card dark"><div class="meta"><div><span class="pill navy">READINESS</span><h3 style="color:#fff;margin-top:10px">Engineering readiness score</h3><p>Project progress across the core implementation lanes required before real deployment.</p></div><span class="pill navy">Customer-hosted</span></div>${readinessProgressHTML([['Workflow logic',88],['Agent configuration',72],['Knowledge binding',66],['Connector readiness',58],['Deployment checks',43]])}<div class="chart-block">${barsSVG([6,2,3,1],['Nodes','Gates','APIs','Risks'])}</div><div class="viz-note">Use this area to communicate status during internal review and pre-sales workshops.</div></aside></div><div class="spacer"></div><div class="two-col"><section class="card" style="padding:24px"><div class="section-title"><div><h2>Solution blueprint</h2><p>Architecture overview</p></div><button class="linkbtn" data-action="goto" data-id="studio">Open canvas ${ic('arrow',13)}</button></div><div class="mini-flow">${s.process.map((x,i)=>`<div>${ic(i===0?'zap':i===s.process.length-1?'check':'workflow',17)}<b>${x}</b></div>`).join('')}</div><div class="divider"></div><div class="section-title"><div><h2>Solution dependencies</h2><p>Complete the bindings to prepare for deployment</p></div></div><div class="tag-row">${s.integrations.map(x=>`<span class="pill">${ic('plug',12)} ${x[0]}</span>`).join('')}${s.knowledge.map(x=>`<span class="pill">${ic('database',12)} ${x[0]}</span>`).join('')}</div></section><section class="detail-panel"><span class="pill blue">${ic('spark',12)} Lifecycle</span><h3>From idea to operating system</h3><p>Configure and validate your solution components, then package them for customer infrastructure.</p>${[['Workflow built','studio'],['Agent bindings','agents'],['Test execution','testing'],['Deployment package','deploy']].map((x,i)=>`<div class="audit-item" style="cursor:pointer" data-action="goto" data-id="${x[1]}"><div class="audit-mark">${ic(i===0?'check':i===1?'bot':i===2?'flask':'rocket',16)}</div><div><strong>${x[0]}</strong><p>${i===0?'Concept structure available':'Explore this stage'}</p></div>${ic('chevron',15)}</div>`).join('')}</section></div>`:`<div class="card" style="padding:27px;min-height:250px"><div class="eyebrow"><i></i> PROJECT / ${esc(state.projectTab.toUpperCase())}</div><h2 class="h2" style="margin:13px 0">${esc(state.projectTab)}</h2><p class="sub">This area is managed by the shared ${esc(state.projectTab)} capability. Open it with this project context.</p><button class="btn primary" data-action="goto" data-id="${route[state.projectTab]}">Open ${esc(state.projectTab)} ${ic('arrow',15)}</button></div>`}</main>`}

function flowEdges(){const ns=state.nodes;const edges=[];for(let i=0;i<ns.length-1;i++){const a=ns[i],b=ns[i+1];let d;if(Math.abs(a.x-b.x)<75){const x1=a.x+88,y1=a.y+112,x2=b.x+88,y2=b.y;const dy=(y2-y1)/2;d=`M ${x1} ${y1} C ${x1} ${y1+dy}, ${x2} ${y2-dy}, ${x2} ${y2}`}else if(b.x<a.x){const x1=a.x,y1=a.y+53,x2=b.x+175,y2=b.y+53,dx=(x1-x2)/2;d=`M ${x1} ${y1} C ${x1-dx} ${y1}, ${x2+dx} ${y2}, ${x2} ${y2}`}else{const x1=a.x+175,y1=a.y+53,x2=b.x,y2=b.y+53,dx=(x2-x1)/2;d=`M ${x1} ${y1} C ${x1+dx} ${y1}, ${x2-dx} ${y2}, ${x2} ${y2}`}edges.push(`<path class="flow-edge-glow" d="${d}"/><path class="flow-edge" d="${d}"/>`)}return `<svg class="flow-edges" viewBox="0 0 760 590" preserveAspectRatio="xMinYMin meet">${edges.join('')}</svg>`}
function studioPage(){const sel=state.nodes.find(n=>n.id===state.selectedNode)||state.nodes[0];return `<main class="page wide"><div class="page-head"><div><div class="eyebrow"><i></i> BUILD / VISUAL ORCHESTRATION</div><h1>Workflow Studio<span style="color:#72a9e9">.</span></h1><p>Build deterministic logic, AI intelligence and human decisions on a single execution canvas.</p></div><div class="head-buttons"><button class="btn ghost small" data-action="goto" data-id="architect">${ic('spark',14)} AI Architect</button><button class="btn primary small" data-action="test">${ic('play',15)} Run simulation</button></div></div><div class="studio-bar"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><span class="pill blue">${ic('workflow',13)} ${esc(scenarios[state.scenario].name)}</span><span class="pill">${state.nodes.length} nodes</span><span class="pill green"><span class="dot"></span> Editable canvas</span></div><div style="display:flex;gap:7px"><button class="btn ghost small" data-action="node-add">${ic('plus',13)} Add node</button><button class="btn ghost small" data-action="goto" data-id="deploy">${ic('rocket',13)} Deploy setup</button></div></div><div class="studio-stage"><section class="canvas-scroll"><div class="flow-canvas" id="flowCanvas"><div class="canvas-top"><span class="canvas-map">FLOW MAP / ${esc(state.scenario.toUpperCase())}</span><span class="pill" style="font-size:9px">Drag nodes · Select to configure</span></div>${flowEdges()}${state.nodes.map(n=>`<div class="flow-node ${esc(n.type)} ${n.id===state.selectedNode?'selected':''}" data-node="${esc(n.id)}" data-action="select-node" data-id="${esc(n.id)}" role="button" tabindex="0" style="left:${n.x}px;top:${n.y}px"><span class="port in"></span><span class="port out"></span><div class="node-hd"><div class="node-icon">${ic(n.type==='agent'?'bot':n.type==='approval'?'shield':n.type==='output'?'check':n.type==='trigger'?'zap':'branch',16)}</div><div><b>${esc(n.name)}</b><small>${esc(n.type.toUpperCase())}</small></div></div><div class="node-desc">${esc(n.detail)}</div><div class="node-status">${ic('settings',11)}</div></div>`).join('')}</div></section><aside class="inspector"><div style="display:flex;justify-content:space-between;align-items:center"><span class="eyebrow"><i></i> NODE INSPECTOR</span><button class="icon-btn" style="width:29px;height:29px">${ic('settings',14)}</button></div>${sel?`<h3>${esc(sel.name)}</h3><p>${esc(sel.detail)} · Configure this node's role in the workflow.</p><div class="property"><strong>Node type</strong><span class="pill blue">${esc(sel.type)}</span></div><div class="property"><strong>Display name</strong><input class="field" value="${esc(sel.name)}" id="nodeName" aria-label="Node name"/></div><div class="property"><strong>Connected capability</strong><span>${esc(sel.detail)}</span></div><div class="property"><strong>Runtime rules</strong><span>${sel.type==='approval'?'Human decision is required':sel.type==='agent'?'Pinned model and skill version':sel.type==='output'?'Authorized connector action':'Validated input and output schema'}</span></div><div class="property"><strong>Capabilities</strong><div class="node-cap"><span class="pill">Versioned</span><span class="pill">Auditable</span><span class="pill">Scoped</span></div></div><div style="display:flex;gap:7px;margin-top:17px"><button class="btn primary small" id="saveNodeName">${ic('check',13)} Save node</button><button class="btn ghost small" data-action="goto" data-id="agents">${ic('bot',13)} Agents</button></div>`:'<p>Select a workflow node to inspect its configuration.</p>'}<div class="sep"></div><span class="field-label">Engineering note</span><p style="font-size:10px">This canvas is interactive concept UI. Connector execution, schema validation and real runtime are not connected.</p></aside></div></main>`}
function agentsPage(){const a=state.agents[state.selectedAgent]||state.agents[0];return `<main class="page"><div class="page-head"><div><div class="eyebrow"><i></i> REUSABLE INTELLIGENCE</div><h1>Agent Studio</h1><p>Configure, evaluate, version and reuse enterprise agents across solutions.</p></div><button class="btn primary" data-action="agent-new">${ic('plus',16)} Create agent</button></div><div class="stat-grid"><div class="stat"><div class="stat-label">${ic('bot',14)} Agent definitions</div><strong>${state.agents.length}</strong><small>Concept registry</small></div><div class="stat"><div class="stat-label">${ic('layers',14)} Available skills</div><strong>08</strong><small>Reusable skill examples</small></div><div class="stat"><div class="stat-label">${ic('cpu',14)} Model providers</div><strong>—</strong><small>Configure production providers</small></div><div class="stat"><div class="stat-label">${ic('shield',14)} Published versions</div><strong>—</strong><small>Not queried from live service</small></div></div><div class="agent-showcase"><article class="visual-card dark"><div class="meta"><div><span class="pill navy">AGENT VISUAL</span><h3 style="color:#fff;margin-top:10px">${esc(a.name)}</h3><p>${esc(a.desc)}</p></div><span class="pill navy">${esc(a.category)}</span></div>${agentConstellationHTML(a)}<div class="viz-note">The visual node map helps explain how each agent combines skills, tools, knowledge and guardrails.</div></article><article class="visual-card"><div class="meta"><div><span class="pill blue">CAPABILITY PROFILE</span><h3>Operational strengths</h3><p>Illustrative scorecard for presentations and quick design review.</p></div></div>${capabilityBarsHTML([['Reasoning',84],['Tool use',76],['Structured output',92],['Knowledge grounding',71],['Approval awareness',88]])}${metricChartSVG([52,60,63,71,78,84],['D1','D2','D3','D4','D5','D6'])}</article></div><div class="spacer"></div><div class="two-col"><section><div class="section-title"><div><h2>Agent library</h2><p>Choose an agent to inspect its capabilities.</p></div><span class="pill">Reusable across projects</span></div><div class="item-list">${state.agents.map((a,i)=>`<article class="item-row ${state.selectedAgent===i?'selected':''}" data-action="select-agent" data-id="${i}" role="button" tabindex="0"><div class="item-avatar">${ic('bot',20)}</div><div><h3>${esc(a.name)}</h3><p>${esc(a.desc)}</p></div><div class="trailing"><span class="pill ${a.status==='Concept'?'':'blue'}">${a.status}</span><div style="margin-top:8px;font-size:9px;color:#96abc2">${esc(a.category)}</div></div></article>`).join('')}</div></section><aside class="detail-panel"><span class="pill blue">${ic('spark',12)} Agent definition</span><h3>${esc(a.name)}</h3><p>${esc(a.desc)}</p><div class="detail-feature"><div class="hd">Model policy <span>Configurable</span></div><p>${esc(a.model)}</p></div><div class="detail-feature"><div class="hd">Assigned skills <span>${a.skills.length}</span></div><div class="tag-row">${a.skills.map(s=>`<span class="pill blue">${esc(s)}</span>`).join('')||'<span class="muted" style="font-size:10px">No skills assigned</span>'}</div></div><div class="detail-feature"><div class="hd">Tool permissions <span>${a.tools.length}</span></div><div class="tag-row">${a.tools.map(s=>`<span class="pill">${esc(s)}</span>`).join('')||'<span class="muted" style="font-size:10px">No tools configured</span>'}</div></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:18px"><button class="btn primary small" data-action="agent-play">${ic('play',13)} Agent playground</button><button class="btn ghost small" data-action="goto" data-id="testing">${ic('flask',13)} Evaluations</button></div></aside></div><div class="spacer"></div><div class="section-title"><div><h2>Skill registry</h2><p>Reusable abilities assigned to agents through approved versions and permissions.</p></div></div><div class="resource-grid">${['Document extraction','Policy reasoning','Structured output','Entity matching','KMS retrieval','API tool calling'].map((s,i)=>`<div class="resource-card"><div class="rface">${ic(i%2?'spark':'layers',20)}</div><h3>${s}</h3><p>Reusable capability · versioned and reviewable across multiple solutions.</p><div class="rfoot"><span>Skill definition</span><button class="btn ghost tiny" data-action="skill-toggle" data-id="${s}">${a.skills.includes(s)?'Assigned':'Assign'} ${ic(state.skills[s]?'check':'plus',12)}</button></div></div>`).join('')}</div></main>`}

function templatesPage(){const all=[...state.imported,...TEMPLATES];const f=all.filter(x=>(state.templateFilter==='All'||x.category===state.templateFilter)&&(!state.templateSearch||`${x.title} ${x.desc}`.toLowerCase().includes(state.templateSearch.toLowerCase())));return `<main class="page"><div class="page-head"><div><div class="eyebrow"><i></i> REUSABLE ENTERPRISE CAPABILITIES</div><h1>Template repository</h1><p>Build from proven process patterns, customize bindings and save your best solutions for reuse.</p></div><div class="head-buttons"><button class="btn ghost" data-action="new-template">${ic('upload',15)} Import workflow</button><button class="btn primary" data-action="goto" data-id="architect">${ic('plus',15)} Create from scratch</button></div></div><div class="filter-bar"><input class="field" id="templateSearch" value="${esc(state.templateSearch)}" placeholder="Search workflow templates..." aria-label="Search templates"/>${['All','Finance','People','Legal','Operations','Imported'].map(c=>`<button class="filter-btn ${state.templateFilter===c?'active':''}" data-action="template-filter" data-id="${c}">${c}</button>`).join('')}</div><div class="template-grid">${f.map((x,i)=>`<article class="template-card"><div class="template-visual ${x.color}"><div class="diagram-flow"><div class="diagram-box">${ic('zap',23)}</div><span class="diagram-arrow">${ic('arrow',16)}</span><div class="diagram-box mid">${ic(x.icon||'workflow',27)}</div><span class="diagram-arrow">${ic('arrow',16)}</span><div class="diagram-box">${ic('check',23)}</div></div></div><div class="template-body"><span class="pill">${esc(x.category)}</span><h3>${esc(x.title)}</h3><p>${esc(x.desc)}</p><div class="template-foot"><span>${x.nodes} steps · ${x.agents} AI agent${x.agents===1?'':'s'}</span><button class="btn soft tiny" data-action="template" data-id="${esc(x.id)}">Use template ${ic('arrow',12)}</button></div></div></article>`).join('')||'<div class="empty">No templates match your search.</div>'}</div><div class="spacer"></div><div class="sample-banner">${ic('info',14)} Template cards are example patterns. Imported JSON is preview-only; adapters and dependency validation are required before execution.</div></main>`}
function knowledgePage(){return `<main class="page"><div class="page-head"><div><div class="eyebrow"><i></i> GOVERNED COMPANY INTELLIGENCE</div><h1>Knowledge Hub</h1><p>Organize, validate and selectively share enterprise knowledge with agents and workflows.</p></div><div class="head-buttons"><button class="btn ghost" data-action="knowledge-upload">${ic('upload',15)} Add documents</button><button class="btn primary" data-action="collection-new">${ic('plus',15)} New collection</button></div></div><input type="file" id="localKnowledgeInput" multiple accept=".pdf,.docx,.txt,.md,.xlsx" style="display:none"/><div class="stat-grid"><div class="stat"><div class="stat-label">${ic('database',14)} Collections</div><strong>${state.knowledge.length}</strong><small>Concept collections</small></div><div class="stat"><div class="stat-label">${ic('document',14)} Referenced documents</div><strong>${state.knowledge.reduce((n,x)=>n+x.docs,0)}</strong><small>Illustrative counts</small></div><div class="stat"><div class="stat-label">${ic('shield',14)} Access policies</div><strong>RBAC</strong><small>Collection-scoped target</small></div><div class="stat"><div class="stat-label">${ic('search',14)} Retrieval</div><strong>RAG</strong><small>Keyword + semantic target</small></div></div><div class="section-title"><div><h2>Knowledge collections</h2><p>Bind the right policy and context to the right agent.</p></div></div><div class="resource-grid">${state.knowledge.map((x,i)=>`<div class="resource-card"><div class="rface" style="background:${i%3===1?'#f0eaff':i%3===2?'#e4f8f3':'#eaf3ff'}">${ic(x.icon,21)}</div><h3>${esc(x.name)}</h3><p>${esc(x.desc)}</p><div class="rfoot"><span>${x.docs} document references</span><button class="btn ghost tiny" data-action="inspect-knowledge" data-id="${i}">Inspect</button></div></div>`).join('')}</div><div class="spacer"></div><div class="two-col"><div class="card" style="padding:23px"><div class="section-title"><div><h2>Knowledge onboarding lifecycle</h2><p>Source traceability, human review and controlled release.</p></div></div><div class="mini-flow">${['Upload','Process','Review','Publish','Bind'].map((x,i)=>`<div>${ic(['upload','cpu','shield','check','link'][i],18)}<b>${x}</b></div>`).join('')}</div></div><div class="detail-panel"><span class="pill blue">${ic('shield',12)} Knowledge governance</span><h3>Grounded, permission-aware retrieval</h3><p>Every agent query should honor the user's rights, source version, document publication state and policy boundaries.</p><div class="tag-row"><span class="pill">Document versioning</span><span class="pill">Collection ACL</span><span class="pill">Citations</span></div></div></div></main>`}
function integrationsPage(){return `<main class="page"><div class="page-head"><div><div class="eyebrow"><i></i> ENTERPRISE CONNECTIVITY</div><h1>Integration Hub</h1><p>Connect workflows and agents to company systems using governed reusable connectors.</p></div><button class="btn primary" data-action="connector-new">${ic('plus',15)} New connector</button></div><div class="sample-banner">${ic('info',14)} These connector cards are configuration concepts, not live authenticated connections.</div><div class="section-title"><div><h2>Connector catalog</h2><p>Support REST API, MCP, webhooks, databases and enterprise applications.</p></div><span class="pill blue">${state.connectors.length} connector definitions</span></div><div class="resource-grid">${state.connectors.map((x,i)=>`<div class="resource-card"><div class="rface">${ic(x.icon,21)}</div><span class="pill" style="float:right">${esc(x.category)}</span><h3>${esc(x.name)}</h3><p>${esc(x.desc)}</p><div class="rfoot"><span>${ic('lock',12)} ${state.localConfig[x.name]?'Defined · untested':'Credentials required'}</span><button class="btn ghost tiny" data-action="connector-config" data-id="${i}">Configure ${ic('arrow',11)}</button></div></div>`).join('')}</div></main>`}
function testingPage(){const t=state.test,steps=scenarios[state.scenario].process,done=!t.running&&t.step>=steps.length,failed=!t.running&&t.fail&&t.step>=4;return `<main class="page"><div class="page-head"><div><div class="eyebrow"><i></i> VALIDATE BEFORE YOU DEPLOY</div><h1>Testing Studio</h1><p>Inspect workflow behavior, agent outputs, human gates and exception paths before publishing.</p></div><button class="btn primary" data-action="test" ${t.running?'disabled':''}>${ic(t.running?'activity':'play',15)} ${t.running?'Simulation running':'Run simulation'}</button></div><div class="sample-banner">${ic('info',14)} Runs below are scripted local simulations; no real AI model, MCP tool or production API is invoked.</div><div class="stat-grid"><div class="stat"><div class="stat-label">${ic('workflow',14)} Stages</div><strong>${steps.length}</strong><small>Workflow structure</small></div><div class="stat"><div class="stat-label">${ic('activity',14)} Current run</div><strong>${t.step<0?'—':`${Math.min(t.step,steps.length)}/${steps.length}`}</strong><small>${t.running?'In progress':done?'Simulation complete':failed?'Exception detected':'Not started'}</small></div><div class="stat"><div class="stat-label">${ic('shield',14)} Human gates</div><strong>1</strong><small>Approval included</small></div><div class="stat"><div class="stat-label">${ic('flask',14)} Execution mode</div><strong style="font-size:18px">Sandbox</strong><small>Local concept</small></div></div><div class="visual-grid"><article class="visual-card"><div class="meta"><div><span class="pill blue">EXECUTION PLAYBACK</span><h3>Run progression over workflow stages</h3><p>Visual playback clarifies how the workflow moves from trigger to approval and final output.</p></div><span class="pill ${done?'green':failed?'amber':'blue'}">${t.running?'Running':done?'Completed':failed?'Exception':'Awaiting run'}</span></div>${metricChartSVG(steps.map((_,i)=>t.step>i?100:t.running&&t.step===i?55:18),steps.map((_,i)=>'S'+(i+1)))}<div class="viz-note">Each point reflects stage completion. Use exception mode to simulate the path to review.</div></article><article class="visual-card dark"><div class="meta"><div><span class="pill navy">QUALITY GATES</span><h3 style="color:#fff;margin-top:10px">Validation coverage</h3><p>Presentation view for explaining test criteria to engineering and governance stakeholders.</p></div></div>${barsSVG([92,88,74,81],['Schema','Policy','Evidence','Output'])}<div class="viz-note">These are illustrative values only; connect them later to real evaluation suites and runtime telemetry.</div></article></div><div class="test-layout"><section class="test-pane"><h3>Simulation configuration</h3><p>Choose an example scenario and execute the workflow stage-by-stage.</p><div class="form-group"><label class="field-label">Workflow</label><select class="field" id="testScenario"><option value="vendor" ${state.scenario==='vendor'?'selected':''}>Vendor Payment</option><option value="recruitment" ${state.scenario==='recruitment'?'selected':''}>Recruitment Intelligence</option><option value="contract" ${state.scenario==='contract'?'selected':''}>Contract Review</option></select></div><div class="form-group"><label class="field-label">Test dataset</label><select class="field"><option>Sample business case (local fixture)</option></select></div><div class="form-group"><label style="display:flex;align-items:center;gap:8px;font-size:11px;color:#58708d"><input id="simulateFailure" type="checkbox" ${t.fail?'checked':''}/> Include simulated exception at stage 4</label></div><div class="sep"></div><h3>Evaluation criteria</h3>${[['Schema validation','Node inputs/outputs match requirements'],['Approval boundary','No agent impersonates a human reviewer'],['Tool policy','Only registered capabilities are usable'],['Evidence trace','Source references are preserved']].map(x=>`<div class="audit-item"><div class="audit-mark">${ic('check',15)}</div><div><strong>${x[0]}</strong><p>${x[1]}</p></div></div>`).join('')}</section><section class="test-pane"><div style="display:flex;align-items:center;justify-content:space-between"><div><h3>Execution trace</h3><p>Event-by-event inspection for ${esc(scenarios[state.scenario].name)}.</p></div><span class="pill ${done?'green':failed?'amber':'blue'}">${t.running?'Running':done?'Completed':failed?'Exception':'Awaiting run'}</span></div><div class="timeline">${steps.map((x,i)=>{let status=t.step>i?(t.fail&&i===3?'failed':'done'):t.running&&t.step===i?'current':'';if(t.fail&&t.step>=4&&i>3)status='';return `<div class="timeline-row ${status}"><div class="time-mark">${ic(status==='done'?'check':status==='failed'?'alert':status==='current'?'activity':'clock',15)}</div><div><strong>${esc(x)}</strong><p>${status==='done'?'Simulation step completed':status==='failed'?'Exception routed for review':status==='current'?'Executing illustrative step...':'Waiting for execution'}</p></div></div>`}).join('')}</div></section></div></main>`}

function deployPage(){const s=scenarios[state.scenario];return `<main class="page"><div class="page-head"><div><div class="eyebrow"><i></i> CUSTOMER-READY SOLUTION DELIVERY</div><h1>Deployment Manager</h1><p>Design for portability: validate, package and release into the customer's infrastructure.</p></div><button class="btn ghost" data-action="goto" data-id="testing">${ic('flask',15)} Open testing</button></div><div class="section-title"><div><h2>Choose your target environment</h2><p>The runtime, credentials, data and controls remain in the chosen customer environment.</p></div></div><div class="deployment-options">${[['Customer VM','server','Container runtime on dedicated customer VM'],['Private Kubernetes','layers','Cluster deployment with isolated namespaces'],['Elenio Managed','cloud','Hosted and operated by the Elenio team']].map(x=>`<button class="deploy-option ${state.deployTarget===x[0]?'active':''}" data-action="deploy-target" data-id="${x[0]}">${ic(x[1],23)}<b>${x[0]}</b><p>${x[2]}</p><div style="margin-top:14px">${state.deployTarget===x[0]?`<span class="pill blue">${ic('check',11)} Selected</span>`:`<span class="pill">Select target</span>`}</div></button>`).join('')}</div><div class="spacer"></div><div class="visual-grid"><article class="visual-card"><div class="meta"><div><span class="pill blue">SELF-HOSTED TOPOLOGY</span><h3>Where the solution runs</h3><p>Use this visual to explain control plane, runtime, and enterprise-system ownership to the customer.</p></div><span class="pill">${esc(state.deployTarget)}</span></div>${deploymentArchitectureHTML(state.deployTarget)}</article><article class="visual-card dark"><div class="meta"><div><span class="pill navy">RELEASE READINESS</span><h3 style="color:#fff;margin-top:10px">Pre-deployment confidence</h3><p>Illustrative view of the checks needed before handing over a customer-hosted release.</p></div></div>${capabilityBarsHTML([['Artifact completeness',81],['Security boundaries',67],['Config validation',76],['Smoke test coverage',58],['Rollback preparedness',49]])}<div class="viz-note">This block can later reflect real CI/CD validation, smoke tests and operations readiness.</div></article></div><div class="spacer"></div><div class="release-panel"><div class="inside"><span class="pill navy">PORTABLE RELEASE CONCEPT</span><h3>Package once. Deploy to the environment you control.</h3><p>Package workflow definitions, approved agent references, connector contracts, data requirements and deployment configuration as a versioned artifact.</p><div class="tag-row" style="margin:18px 0 23px"><span class="pill navy">${ic('package',12)} Workflow bundle</span><span class="pill navy">${ic('shield',12)} Policies</span><span class="pill navy">${ic('server',12)} Runtime config</span><span class="pill navy">${ic('activity',12)} Health checks</span></div><button class="btn primary" data-action="release">${ic('package',15)} Prepare release manifest</button></div></div><div class="spacer"></div><div class="two-col"><section class="card" style="padding:23px"><div class="section-title"><div><h2>Release specification</h2><p>${esc(s.name)} · ${esc(state.deployTarget)}</p></div>${state.release?'<span class="pill green">Manifest prepared</span>':'<span class="pill">Not prepared</span>'}</div><pre class="manifest">${esc(JSON.stringify(state.release||{solution:s.name,target:state.deployTarget,version:'0.1.0-concept',artifacts:['workflow-definition','agent-bindings','connector-contracts','knowledge-references'],state:'Awaiting package preparation'},null,2))}</pre><div style="display:flex;gap:9px;margin-top:17px"><button class="btn primary small" data-action="manifest" ${!state.release?'disabled':''}>${ic('download',14)} Download JSON manifest</button><button class="btn ghost small" data-action="goto" data-id="operations">${ic('activity',14)} Operations</button></div></section><aside class="detail-panel"><span class="pill blue">${ic('shield',12)} Release readiness</span><h3>Production requirements</h3><p>Before real deployment, validate all external dependencies and security boundaries.</p>${['Production credentials injected on target','KMS & LLM data residency confirmed','Runtime images built and tested','Smoke test / rollback verified','Customer operations handover'].map(x=>`<div class="audit-item"><div class="audit-mark">${ic('clock',14)}</div><div><strong>${x}</strong><p>Requires implementation verification</p></div></div>`).join('')}</aside></div></main>`}

function operationsPage(){return `<main class="page"><div class="page-head"><div><div class="eyebrow"><i></i> AI SOLUTION OPERATIONS</div><h1>Operations Center</h1><p>Observe workflow executions, investigate exceptions and keep people in control.</p></div><button class="btn primary" data-action="test">${ic('play',15)} Simulate a run</button></div><div class="sample-banner">${ic('info',14)} Sample operations data for product UX exploration. Not connected to production services.</div><div class="stat-grid"><div class="stat"><div class="stat-label">${ic('activity',14)} Example executions</div><strong>128</strong><small>Illustrative data</small></div><div class="stat"><div class="stat-label">${ic('check',14)} Example success</div><strong>96%</strong><small>Illustrative data</small></div><div class="stat"><div class="stat-label">${ic('clock',14)} Awaiting review</div><strong>${state.opsApproved?'2':'3'}</strong><small>Illustrative queue</small></div><div class="stat"><div class="stat-label">${ic('alert',14)} Exceptions</div><strong>02</strong><small>Illustrative queue</small></div></div><div class="ops-layout-2"><article class="visual-card"><div class="meta"><div><span class="pill blue">OPERATIONS TREND</span><h3>Runtime activity and queue health</h3><p>Visual telemetry helps operations teams spot throughput and exception patterns quickly.</p></div><span class="pill">Concept data</span></div>${metricChartSVG([22,30,28,37,43,39,48],['Mon','Tue','Wed','Thu','Fri','Sat','Sun'])}<div class="metric-strip"><div class="metric-tile"><strong>18</strong><span>Avg / hour</span></div><div class="metric-tile"><strong>3</strong><span>Awaiting review</span></div><div class="metric-tile"><strong>2</strong><span>Exceptions</span></div></div></article><article class="visual-card dark"><div class="meta"><div><span class="pill navy">EXECUTION MIX</span><h3 style="color:#fff;margin-top:10px">What happened this week</h3><p>Use bars and breakdowns to explain the operational outcome of the solution.</p></div></div>${barsSVG([96,22,8,2],['Success','Review','Retry','Fail'])}<div class="viz-note">These values are illustrative; later, connect them to real workflow runs and approval queues.</div></article></div><div class="ops-columns"><section class="table-card"><div style="padding:19px 20px;display:flex;justify-content:space-between"><div><strong style="font-size:13px">Recent execution runs</strong><p style="font-size:10px;color:#91a5b9">Trace every action, approval and system response</p></div><span class="pill blue">Sample records</span></div><div class="table-scroll"><table><thead><tr><th>Run ID</th><th>Solution</th><th>State</th><th>Last activity</th><th>Action</th></tr></thead><tbody>${[['#EX-2108','Vendor Payment','Completed','Example · 2 min ago'],['#EX-2107','Recruitment','Human review','Example · 14 min ago'],['#EX-2106','Contract Review','Exception','Example · 41 min ago'],['#EX-2105','Vendor Payment','Completed','Example · 1 hr ago']].map(x=>`<tr><td><strong>${x[0]}</strong></td><td>${x[1]}</td><td><span class="pill ${x[2]==='Completed'?'green':x[2]==='Exception'?'amber':'blue'}">${x[2]}</span></td><td>${x[3]}</td><td><button class="btn ghost tiny" data-action="goto" data-id="testing">Inspect</button></td></tr>`).join('')}</tbody></table></div></section><aside class="detail-panel"><span class="pill blue">${ic('users',12)} HUMAN IN THE LOOP</span><h3>Pending approvals</h3><p>Agent outputs require review before controlled business actions.</p>${[['Invoice #INV-2048','Finance approval'],['Candidate shortlist','HR reviewer'],['Contract deviation','Legal approval']].map((x,i)=>`<div class="audit-item"><div class="audit-mark">${ic('shield',15)}</div><div><strong>${x[0]}</strong><p>${x[1]}</p></div>${i===0&&!state.opsApproved?`<button class="btn soft tiny" data-action="review-approval">Review</button>`:i===0?'<span class="pill green">Reviewed</span>':''}</div>`).join('')}<div style="margin-top:18px"><button class="btn ghost small" data-action="retry">${ic('refresh',13)} Simulate retry</button></div></aside></div></main>`}

function settingsPage(){return `<main class="page"><div class="page-head"><div><div class="eyebrow"><i></i> ENTERPRISE GOVERNANCE</div><h1>Control Center</h1><p>Manage organization access, model policies, security and platform-level dependencies.</p></div></div><div class="resource-grid">${[['Workspace & Members','users','Organization teams, RBAC, access boundaries.'],['Models & Providers','cpu','Approved LLM endpoints, limits and routing.'],['Security Policies','shield','Human approval, permissions and audit controls.'],['Environments','server','Customer VM, cluster and release targets.'],['Audit & Retention','activity','Platform actions, history and data retention.'],['Capability Governance','layers','Reviews, reusable assets and release policies.']].map(x=>`<div class="resource-card"><div class="rface">${ic(x[1],21)}</div><h3>${x[0]}</h3><p>${x[2]}</p><div class="rfoot"><span>Administration</span><span class="muted">Production configuration</span></div></div>`).join('')}</div><div class="spacer"></div><div class="sample-banner">${ic('shield',14)} This prototype does not manage real user permissions, provider credentials or production infrastructure.</div></main>`}
function modal(){const m=state.modal;let title='',content='';if(m==='review-approval'){title='Review finance approval';content=`<span class="pill amber">${ic('shield',12)} Human authorization required</span><div class="detail-feature"><div class="hd">Invoice #INV-2048 <span>Illustrative task</span></div><p>Vendor payment reached the finance approval stage. Verify the invoice, purchase order and policy references before a real authorization decision.</p></div><div class="sample-banner">${ic('info',14)} This interaction only updates a sample UX state. It does not release a payment or contact an ERP.</div><div class="modal-footer"><button class="btn ghost small" data-action="reject">Reject locally</button><button class="btn primary small" data-action="approve">${ic('check',14)} Approve locally</button></div>`;}else if(m==='new-solution'){title='Create a new AI solution';content=`<div class="form-group"><label class="field-label">Solution name</label><input class="field" id="modalName" placeholder="e.g. Employee Onboarding Automation" autofocus/></div><div class="form-group"><label class="field-label">What should it do?</label><textarea class="field" id="modalDesc" placeholder="Describe the business process, triggers, systems and desired outcome..."></textarea></div>`}else if(m==='new-agent'){title='Create reusable AI agent';content=`<div class="form-group"><label class="field-label">Agent name</label><input class="field" id="modalName" placeholder="e.g. Procurement Analyst" autofocus/></div><div class="form-group"><label class="field-label">Purpose</label><textarea class="field" id="modalDesc" placeholder="What does this agent help accomplish?"></textarea></div>`}else if(m==='new-collection'){title='New knowledge collection';content=`<div class="form-group"><label class="field-label">Collection name</label><input class="field" id="modalName" placeholder="e.g. Procurement Policies" autofocus/></div><div class="form-group"><label class="field-label">Description</label><textarea class="field" id="modalDesc" placeholder="Sources and authorized users..."></textarea></div>`}else if(m==='new-connector'){title='Register connector';content=`<div class="form-group"><label class="field-label">Connector name</label><input class="field" id="modalName" placeholder="e.g. SAP Purchase Orders API" autofocus/></div><div class="form-group"><label class="field-label">Connector type</label><select class="field" id="modalKind"><option>REST API</option><option>MCP</option><option>Webhook</option><option>Database</option></select></div><div class="form-group"><label class="field-label">Purpose</label><textarea class="field" id="modalDesc" placeholder="What data and actions does this connector expose?"></textarea></div>`}else if(m==='add-node'){title='Add workflow node';content=`<div class="form-group"><label class="field-label">Node name</label><input class="field" id="modalName" placeholder="e.g. Policy Validation" autofocus/></div><div class="form-group"><label class="field-label">Node type</label><select class="field" id="modalKind"><option value="agent">AI Agent</option><option value="logic">Business Logic</option><option value="approval">Human Approval</option><option value="output">Tool / API Action</option><option value="trigger">Trigger</option></select></div>`}else if(m==='import-template'){title='Import external workflow';content=`<p class="sub">Upload a JSON workflow definition to preview it in the repository. Source adapters, dependency resolution and security validation are required before execution.</p><input type="file" id="templateFileInput" accept=".json,application/json" style="display:none"/><div class="card" style="padding:34px;text-align:center;border-style:dashed"><div style="color:#0b71e5">${ic('upload',30)}</div><h3 style="margin:13px 0 7px;font-size:14px">Import a workflow definition</h3><p class="sub" style="margin:0 auto 15px">JSON file for this interactive preview</p><button class="btn primary small" data-action="open-file">Choose JSON file</button></div>`}else if(m==='agent-test'){const a=state.agents[state.selectedAgent];title=`Agent playground · ${a.name}`;content=`<div class="sample-banner">${ic('info',14)} This view illustrates agent testing. No live LLM is invoked.</div><div class="form-group"><label class="field-label">Example input</label><textarea class="field" placeholder="Enter a sample task for the agent..."></textarea></div><div class="detail-feature"><div class="hd">Expected behavior</div><p>${esc(a.desc)}. Outputs should be structured, evidence-grounded and reviewed where required.</p></div>`}else if(m.startsWith('connector-')){const a=state.connectors[Number(m.split('-')[1])]||state.connectors[0];title=`Configure ${a.name}`;content=`<p class="sub">${esc(a.desc)}</p><div class="form-group"><label class="field-label">Connection endpoint (example)</label><input class="field" placeholder="https://internal-system.example/api"/></div><div class="form-group"><label class="field-label">Authentication policy</label><select class="field"><option>Managed secret reference</option><option>OAuth 2.0</option><option>Service token</option><option>mTLS</option></select></div><div class="sample-banner">${ic('lock',14)} Real credentials must be entered in a secure backend vault, not in this HTML concept.</div>`}return `<div class="overlay" data-overlay="true"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-hd"><h3>${esc(title)}</h3><button class="modal-close" data-action="modal-close" aria-label="Close">${ic('close',17)}</button></div>${content}<div class="modal-footer"><button class="btn ghost small" data-action="modal-close">Close</button>${!['import-template','agent-test','review-approval'].includes(m)&&!m.startsWith('connector-')?`<button class="btn primary small" data-action="modal-submit">${ic('check',14)} Create locally</button>`:''}</div></section></div>`}
function command(){const items=NAV.flatMap(x=>x[1]);return `<div class="overlay" data-overlay="true"><section class="command-box" role="dialog" aria-modal="true" aria-label="Navigate pages"><div class="command-input">${ic('search',20)}<input id="commandInput" placeholder="Jump to a page, capability, or workspace..." autofocus/><span class="pill">ESC</span></div><div class="command-items" id="commandItems">${items.map(x=>`<button data-action="goto" data-id="${x[0]}">${ic(x[2],17)} ${x[1]} ${ic('arrow',13)}</button>`).join('')}</div></section></div>`}
// Stable delegation for controls and interactions.

function networkGraph(nodes,{home=false,playback=false,interactive=true}={}){const W=640,H=430,cx=320,cy=205,Rx=213,Ry=128;const graphLimit=8;let items=home?[{id:'architecture',name:'AI Architect',detail:'Requirements',type:'agent'},{id:'workflow',name:'Workflow',detail:'Process logic',type:'logic'},{id:'agents',name:'Agent Studio',detail:'Reasoning',type:'agent'},{id:'integrations',name:'API / MCP',detail:'Enterprise tools',type:'api'},{id:'approval',name:'Human review',detail:'Governed action',type:'approval'},{id:'knowledge',name:'Company KMS',detail:'Evidence',type:'knowledge'}]:nodes.length>graphLimit?(playback&&state.runtime?.current>=graphLimit?[...nodes.slice(0,graphLimit-1),nodes[state.runtime.current]]:nodes.slice(0,graphLimit)):nodes;const coords=items.map((n,i)=>{let a=-Math.PI/2+i*2*Math.PI/Math.max(items.length,1);return {...n,gx:cx+Math.cos(a)*Rx,gy:cy+Math.sin(a)*Ry,status:home?'pending':playback?nodeStatus(n,i):(n.id===state.selectedNode?'active':'pending')}});const particles=Array.from({length:54},(_,i)=>{const a=i*2.399963,rr=55+(i%9)*6;return `<circle class="particle" style="animation-delay:${(i%12)*-.27}s" cx="${cx+Math.cos(a)*rr}" cy="${cy+Math.sin(a)*rr*.82}" r="${i%5===0?2.1:1.15}" fill="${i%3===0?'#9de7ff':'#599cd8'}" opacity="${i%3===0?.8:.45}"/>`}).join('');const center=home?'ORCHESTRATOR':state.runtime?.status==='waiting'?'HUMAN GATE':state.runtime?.status==='completed'?'RUN COMPLETE':'ORCHESTRATOR';return `<svg class="v3graph ${home?'light-graph':''}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${home?'Platform capability network':'Current workflow orchestration graph'}"><defs><radialGradient id="v3core"><stop offset="0" stop-color="#92dbff"/><stop offset=".52" stop-color="#197bcf"/><stop offset="1" stop-color="#07366b"/></radialGradient><radialGradient id="v3halo"><stop offset="0" stop-color="#228fff" stop-opacity=".28"/><stop offset="1" stop-color="#228fff" stop-opacity="0"/></radialGradient></defs><circle cx="${cx}" cy="${cy}" r="1 ke-opacity=".72"/><text x="${n.gx}" y="${n.gy+48}" text-anchor="middle" fill="#edf6ff" font-size="10.1" font-weight="700">${esc(lineText(n.name,25))}</text><text x="${n.gx}" y="${n.gy+61}" text-anchor="middle" fill="#95b2d5" font-size="8.7">${esc(playback?stateLabel(n.status):lineText(home?n.detail:kind(n)[1],25))}</text></g>`}).join('')}</svg>${!home&&nodes.length>graphLimit?`<p class="v3graph-note">Showing ${graphLimit} of ${nodes.length} stages; full sequence is available in the workflow list.</p>`:''}`;}

architectPage=function(){const s=currentScenario(),ready=state.hasBlueprint;return `<main class="page wide">${pageHead('AI Solution Architect','Describe, refine and review your technical solution before building.',ready?actionButton('Build workflow','build'):'',ready)}<div class="v3architect"><section class="chat-panel"><div class="panel-top"><strong style="display:flex;align-items:center;gap:8px">${ic('spark',18)} Solution conversation</strong><span>Local planning</span></div><div class="chat-thread">${(state.chat.length?state.chat:[{role:'ai',text:'Describe the business process you want to automate. Include the trigger, systems, human decision points and expected output.'}]).map(m=>`<div><div class="message-role">${m.role==='ai'?`<span class="role-badge">${ic('spark',14)}</span> AI Architect`:'You'}</div><div class="bubble ${m.role==='ai'?'ai':'user'}">${esc(m.text)}</div></div>`).join('')}</div><div class="prompt-extras"><button data-action="architect-quick" data-id="approval">Add approval</button><button data-action="architect-quick" data-id="local">Customer-hosted</button><button data-action="architect-quick" data-id="reuse">Reuse capabilities</button></div><form class="chat-input" id="chatForm"><textarea id="chatText" placeholder="Describe or refine the requirement..." aria-label="Refine solution"></textarea><button class="send-btn" type="submit" aria-label="Send">${ic('send',16)}</button></form></section><section class="blueprint-panel"><div class="blueprint-head"><div><div class="v3label">${ready?'SOLUTION BLUEPRINT':'SOLUTION DISCOVERY'}</div><h2>${ready?esc(s.name):'Start with a requirement'}</h2><p>${ready?`${state.nodes.length} stages · ${agentBindings().length} agent bindings · ${s.integrations.length} integrations`:'The blueprint will appear here.'}</p></div></div>${ready?tabs(['Blueprint','Agent map','Dependencies'],state.blueprintTab,'blueprint-tab')+ (state.blueprintTab==='Blueprint'?stepList(state.nodes):state.blueprintTab==='Agent map'?`<div class="v3dark">${networkGraph(state.nodes)}<p>Choose a component to inspect it in Workflow Studio.</p></div>`:depsPanel())+`<div class="v3actionrow"><p class="v3smallnote">Edits made here are reflected in the workflow canvas. Unconfigured connections remain dependencies.</p>${actionButton('Open builder','build','',false)}</div>`:`<div class="v3dark"><h3>One connected architecture</h3>${networkGraph([],{home:true})}</div>`}</section></div></main>`};
function applyRefinement(text){const t=text.toLowerCase(),s=currentScenario();let msg;if(!state.hasBlueprint){startArchitect(text);return}if(/(approval|persetujuan|approve)/.test(t)&&/(add|include|tambah|mandatory|wajib)/.test(t)){if(!state.nodes.some(n=>n.type==='approval')){const n={id:'approval-'+Date.now(),name:'Human approval',type:'approval',detail:'Authorized reviewer'};state.nodes.splice(Math.max(1,state.nodes.length-1),0,n);state.nodes=layoutNodes(state.nodes);invalidate();msg='Added a mandatory human approval node before the final action.'}else msg='The workflow already contains a human approval gate. It will pause in the simulation until an authorized human decision is provided.'}else if(/(local llm|customer.host|self.host|on.prem|customer vm)/.test(t)){state.deployTarget='Customer VM';state.release=null;msg='Set Customer VM as the intended deployment target. Model endpoint, credentials and data residency must be configured in that environment.'}else if(/(reuse|reus|existing|pakai ulang)/.test(t)){msg=`Reusable agent bindings in this workflow: ${agentBindings().join(', ')||'none'}. Open Agent Studio to review or create the matching capability. I have not created duplicate agents.`}else if(/(remove|hapus)/.test(t)){msg='Select the relevant node in Workflow Studio and use Remove node. I will not delete a process step based on an ambiguous text request.'}else if(/(api|mcp|integrat)/.test(t)){msg=`The design currently requires ${s.integrations.map(x=>x[0]).join(', ')||'no registered connector'}. Open Integration Hub to define connector endpoints. The local planner has not invoked any API.`}else{msg='Requirement saved in the solution conversation. For additional changes, use the visual builder to add or edit nodes; general AI-driven graph generation will require the real workflow architect backend.'}state.chat.push({role:'user',text},{role:'ai',text:msg});saveProject();render();}
onChatSubmit=function(e){e.preventDefault();const q=document.getElementById('chatText')?.value.trim();if(q)applyRefinement(q)};
projectPage=function(){const s=currentScenario(),r=state.runtime,ok=readiness().filter(x=>x[1]).length;return `<main class="page">${pageHead(esc(s.name),esc(s.short),actionButton('Open workflow','goto','studio'))}<div class="v3subnav">${[['Overview','project'],['Workflow','studio'],['Agents','agents'],['Knowledge','knowledge'],['Integrations','integrations'],['Test','testing'],['Deploy','deploy'],['Runs','operations']].map(([label,id])=>`<button class="filter-btn ${id==='project'?'active':''}" data-action="goto" data-id="${id}">${label}</button>`).join('')}</div><div class="v3split"><section class="v3dark"><div class="v3run-head"><div><h3>Solution topology</h3><p>Click a component to inspect its role.</p></div><span class="pill navy">${state.nodes.length} stages</span></div>${networkGraph(state.nodes)}<div class="v3statusbar"><div><b>${state.nodes.length}</b><span>Workflow nodes</span></div><div><b>${agentBindings().length}</b><span>Agent bindings</span></div><div><b>${state.nodes.filter(n=>n.type==='approval').length}</b><span>Approval gates</span></div></div></section><section class="v3panel"><div class="v3run-head"><div><h3>Engineering readiness</h3><p>${ok} of ${readiness().length} local milestones</p></div><strong>${ok}/${readiness().length}</strong></div><div class="v3progress"><b style="width:${ok/readiness().length*100}%"></b></div>${readinessList()}<div class="v3actionrow">${actionButton('Run validation','test')}</div><p class="v3smallnote">Local readiness is not a production certification.</p></section></div><div class="v3section v3panel"><h3>Solution dependencies</h3><p>References required for this solution.</p>${depsPanel()}</div></main>`};
function canvasHTML({playback=false}={}){const h=Math.max(545,150+Math.ceil(state.nodes.length/3)*190);return `<div class="adaptive-canvas"><section class="mobile-flow" aria-label="Responsive workflow path"><div class="mobile-flow-heading"><span>${playback?'EXECUTION PLAYBACK':'WORKFLOW PATH'}</span><small>${state.nodes.length} stages</small></div>${state.nodes.map((n,i)=>`<div class="mobile-flow-stage"><button class="mobile-node ${n.id===state.selectedNode?'selected':''} ${playback?nodeStatus(n,i):''}" data-action="${playback?'graph-node':'select-node'}" data-id="${esc(n.id)}" aria-label="Inspect ${esc(n.name)}"><span class="mobile-node-number">${String(i+1).padStart(2,'0')}</span><span class="mobile-node-icon">${ic(playback&&nodeStatus(n,i)==='completed'?'check':kind(n)[0],19)}</span><span class="mobile-node-text"><b>${esc(n.name)}</b><small>${esc(n.detail||kind(n)[1])}</small></span><span class="mobile-node-status">${esc(playback?stateLabel(nodeStatus(n,i)):kind(n)[1])}</span></button>${i<state.nodes.length-1?'<div class="mobile-node-wire" aria-hidden="true"></div>':''}</div>`).join('')}</section><section class="canvas-scroll v3canvas"><div class="flow-canvas" id="flowCanvas" style="height:${h}px"><div class="canvas-top"><span class="canvas-map">${playback?'EXECUTION PLAYBACK':'WORKFLOW CANVAS'}</span><span class="pill">${playback?'Local simulation':'Drag nodes · Select to inspect'}</span></div>${flowEdges()}${state.nodes.map((n,i)=>`<div class="flow-node ${esc(n.type)} ${n.id===state.selectedNode?'selected':''} ${playback?'v3'+nodeStatus(n,i):''}" data-node="${esc(n.id)}" data-action="${playback?'graph-node':'select-node'}" data-id="${esc(n.id)}" role="button" tabindex="0" style="left:${n.x}px;top:${n.y}px"><span class="port in"></span><span class="port out"></span><div class="node-hd"><div class="node-icon">${ic(playback&&nodeStatus(n,i)==='completed'?'check':kind(n)[0],16)}</div><div><b>${esc(n.name)}</b><small>${esc(playback?stateLabel(nodeStatus(n,i)):kind(n)[1])}</small></div></div><div class="node-desc">${esc(n.detail)}</div><div class="node-status">${ic('settings',11)}</div></div>`).join('')}</div></section></div>`}
// Edges maintain the exact same coordinate space as cards. The SVG expands as more nodes are added.
flowEdges=function(){const ns=state.nodes,hh=Math.max(545,150+Math.ceil(ns.length/3)*190);let paths=[];for(let i=0;i<ns.length-1;i++){const a=ns[i],b=ns[i+1],horizontal=Math.abs(a.x-b.x)>75;let x1,y1,x2,y2,d;if(!horizontal){x1=a.x+87;y1=a.y+112;x2=b.x+87;y2=b.y;d=`M${x1} ${y1} C${x1} ${(y1+y2)/2} ${x2} ${(y1+y2)/2} ${x2} ${y2}`}else{x1=a.x+(b.x>a.x?175:0);y1=a.y+52;x2=b.x+(b.x>a.x?0:175);y2=b.y+52;d=`M${x1} ${y1} C${(x1+x2)/2} ${y1} ${(x1+x2)/2} ${y2} ${x2} ${y2}`}paths.push(`<path class="flow-edge-glow" d="${d}"/><path class="flow-edge" d="${d}"/>`)}return `<svg class="flow-edges" viewBox="0 0 760 ${hh}" preserveAspectRatio="none" style="width:760px;height:${hh}px">${paths.join('')}</svg>`};
studioPage=function(){const sel=state.nodes.find(n=>n.id===state.selectedNode)||state.nodes[0];return `<main class="page wide">${pageHead('Workflow Studio','Compose agents, system actions and human decisions on one execution canvas.',actionButton('Run simulation','test'))}<div class="v3nodepalette"><span class="v3label">ADD COMPONENT</span>${Object.entries(kinds).map(([t,[ico,l]])=>`<button data-action="quick-node" data-id="${t}">${ic(ico,15)} ${l}</button>`).join('')}<button data-action="reflow" title="Arrange nodes">${ic('workflow',15)} Auto-layout</button></div><div class="studio-stage">${canvasHTML()}<aside class="inspector"><div class="v3label">NODE INSPECTOR</div>${sel?`<h3>${esc(sel.name)}</h3><p>${esc(kind(sel)[1])}</p><div class="property"><strong>Display name</strong><input class="field" value="${esc(sel.name)}" id="v3nodeName"/></div><div class="property"><strong>Capability / binding</strong>${sel.type==='agent'?`<select class="field" id="v3nodeBinding">${[...new Set([sel.detail,...state.agents.map(a=>a.name)])].map(n=>`<option ${n===sel.detail?'selected':''}>${esc(n)}</option>`).join('')}</select>`:`<input class="field" id="v3nodeBinding" value="${esc(sel.detail)}"/>`}</div><div class="property"><strong>Execution rule</strong><span>${sel.type==='approval'?'Wait for a human decision':sel.type==='agent'?'Pinned agent definition':sel.type==='output'||sel.type==='api'?'Allowlisted system operation':'Validated process logic'}</span></div><div class="v3actionrow"><button class="btn primary small" data-action="save-node">Save changes</button><button class="v3link muted" data-action="remove-node" data-id="${esc(sel.id)}">Remove node</button></div>`:'<p>Select a node to configure its behavior.</p>'}</aside></div><form class="v3prompt" id="studioForm">${ic('spark',20)}<input id="studioPrompt" placeholder="Refine workflow: e.g. add human approval before output" aria-label="Refine workflow"/><button class="btn ghost small" type="submit">Apply guidance</button></form><div class="v3actionrow"><p class="v3smallnote">Workflow changes are shared with the project, testing and release views. No live runtime is connected.</p>${actionButton('Back to project','goto','project',false)}</div></main>`};
function avatar(type,variant=0){const c=['#1276e6','#1a53b2','#159fbe','#3971cd','#2a96c4','#1568bf'][variant%6];return `<div class="v3avatar"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="38" fill="none" stroke="${c}" stroke-opacity=".2" stroke-dasharray="3 5"/><circle cx="50" cy="50" r="33" fill="none" stroke="${c}" stroke-opacity=".3"/><ellipse cx="50" cy="50" rx="43" ry="25" transform="rotate(-40 50 50)" fill="none" stroke="${c}" stroke-opacity=".35"/><rect x="27" y="28" width="46" height="45" rx="16" fill="${c}"/><rect x="32" y="33" width="36" height="35" rx="13" fill="#0c284d" opacity=".92"/>${visualSymbol(type,50,51,1.18)}<circle cx="72" cy="32" r="4" fill="#77e4ff"/><circle cx="25" cy="70" r="2.4" fill="${c}"/></svg></div>`}
agentsPage=function(){const a=state.agents[state.selectedAgent]||state.agents[0],idx=state.selectedAgent,items=['Profile','Skills','Tools','Playground'];return `<main class="page">${pageHead('Agent Studio','Create and reuse governed agent definitions across solutions.',actionButton('Create agent','agent-new'),false)}<div class="v3split"><section class="v3panel"><div class="section-title"><div><h2>Agent library</h2><p>${state.agents.length} local definitions</p></div></div><div class="v3agentlist">${state.agents.map((x,i)=>`<button class="v3agentcard ${i===idx?'active':''}" data-action="select-agent" data-id="${i}">${avatar(/document|cv/i.test(x.name)?'knowledge':/exception/i.test(x.name)?'approval':/architect/i.test(x.name)?'logic':'agent',i)}<span><b>${esc(x.name)}</b><small>${esc(x.category)} · ${esc(x.status)}</small></span></button>`).join('')}</div></section><section class="v3panel"><div class="v3agenthead">${avatar(/document|cv/i.test(a.name)?'knowledge':/exception/i.test(a.name)?'approval':/architect/i.test(a.name)?'logic':'agent',idx)}<div><div class="v3label">AGENT DEFINITION</div><h3 style="font-size:20px;margin-top:6px">${esc(a.name)}</h3><p>${esc(a.desc)}</p></div></div>${tabs(items,state.agentTab,'agent-tab')}${state.agentTab==='Profile'?`<div class="detail-feature"><div class="hd">Model policy</div><p>${esc(a.model)}</p></div><div class="detail-feature"><div class="hd">Capability inventory</div><div class="v3runchart">${[['Skills',a.skills.length],['Tools',a.tools.length],['Current uses',state.nodes.filter(n=>n.detail===a.name).length]].map(([n,v])=>`<div><b>${v}</b><i style="height:${Math.max(5,v*22)}px"></i><span>${n}</span></div>`).join('')}</div></div><button class="btn primary small" data-action="bind-agent" data-id="${idx}">Add to current workflow</button>`:state.agentTab==='Skills'?`<p>Assign reusable capabilities to this draft.</p><div class="v3flowlist">${[...new Set([...a.skills,'Document extraction','Policy reasoning','Structured output','Entity matching','KMS retrieval','API tool calling'])].map(k=>`<div class="v3step"><div><b>${esc(k)}</b><small>${a.skills.includes(k)?'Assigned to agent':'Available capability'}</small></div><button style="margin-left:auto" class="btn ghost tiny" data-action="skill-toggle" data-id="${esc(k)}">${a.skills.includes(k)?'Remove':'Assign'}</button></div>`).join('')}</div>`:state.agentTab==='Tools'?`<p>Tool permissions are explicit bindings; none are authenticated here.</p>${a.tools.map(x=>`<div class="v3step"><span class="v3stepicon">${ic('plug',15)}</span><div><b>${esc(x)}</b><small>Configuration required</small></div></div>`).join('')||'<div class="v3empty">No tools assigned</div>'}<div class="v3actionrow">${actionButton('Integration Hub','goto','integrations',false)}</div>`:`<p>Test the agent interaction with a local fixture.</p><textarea class="field" id="probeText" placeholder="Enter a sample task or document excerpt"></textarea><div class="v3actionrow"><button class="btn primary small" data-action="probe-agent">Run local fixture</button></div>${state.agentProbe?`<div class="v3scene"><b>Fixture output</b><p>${esc(state.agentProbe)}</p></div>`:''}`}</section></div></main>`};
function appendNode(type,name,detail){if(state.nodes.length>=24){toast('This prototype supports up to 24 nodes.');return}const n={id:'n-'+Date.now()+'-'+Math.floor(Math.random()*1000),name:name||kind({type})[1],type,detail:detail||'Configure capability'};const output=state.nodes.findIndex(x=>x.type==='output');state.nodes.splice(output>=0&&type!=='output'?output:state.nodes.length,0,n);state.nodes=layoutNodes(state.nodes);state.selectedNode=n.id;invalidate();}
function getRuntime(){return state.runtime}
function appendTrace(node,status,message){const r=state.runtime;if(!r)return;r.history.push({node:node?.name||'Workflow',status,message,time:new Date().toLocaleTimeString()})}
function archiveRun(){const r=state.runtime;if(!r)return;const rec={id:r.id,project:state.activeProject,name:currentScenario().name,status:r.status,states:clone(r.states),history:clone(r.history),ended:new Date().toLocaleTimeString()};const i=runArchive.findIndex(x=>x.id===r.id);if(i>=0)runArchive[i]=rec;else runArchive.unshift(rec);saveProject();}
function finishRun(status){if(!state.runtime)return;state.runtime.status=status;state.test.running=false;archiveRun();render()}
function stopRun(reason='Stopped by user'){runToken++;if(state.runtime){if(state.runtime.current>=0&&state.nodes[state.runtime.current])state.runtime.states[state.nodes[state.runtime.current].id]='stopped';appendTrace(null,'stopped',reason);finishRun('stopped')}}
function advanceRun(token){const r=state.runtime;if(!r||token!==runToken||r.status!=='running')return;const i=r.current+1;if(i>=state.nodes.length){appendTrace(null,'completed','All local workflow stages completed.');finishRun('completed');return}const n=state.nodes[i];r.current=i;state.runNode=n.id;state.selectedNode=n.id;r.states[n.id]=n.type==='approval'?'waiting':'active';if(n.type==='approval'){r.status='waiting';appendTrace(n,'waiting','Awaiting explicit human authorization.');archiveRun();render();return}appendTrace(n,'active',n.type==='agent'?`Agent ${n.detail} is processing a fixture input.`:n.type==='api'||n.type==='output'?'Simulated system action; no external request.':'Executing local process stage.');render();setTimeout(()=>{if(token!==runToken||r.status!=='running')return;if(r.fail&&i===Math.min(3,state.nodes.length-1)){r.states[n.id]='failed';appendTrace(n,'failed','Injected exception. No downstream system action executed.');finishRun('failed');return}r.states[n.id]='completed';appendTrace(n,'completed',n.type==='agent'?'Fixture result available for review.':'Stage completed locally.');advanceRun(token)},n.type==='agent'?1150:650)}
runTest=function(){if(state.runtime?.status==='running'||state.runtime?.status==='waiting'){go('testing');return}if(!state.nodes.length){toast('Add a workflow node first.');return}state.release=null;const token=++runToken;state.runtime={id:'RUN-'+Date.now().toString().slice(-7),status:'running',states:Object.fromEntries(state.nodes.map(n=>[n.id,'pending'])),current:-1,history:[],fail:!!state.test.fail};state.test.running=true;go('testing');advanceRun(token)};
function decideRun(approve){const r=state.runtime;if(!r||r.status!=='waiting')return;const n=state.nodes[r.current];r.states[n.id]=approve?'completed':'rejected';appendTrace(n,approve?'completed':'rejected',approve?'Human approved the local fixture.':'Human rejected the local fixture. Downstream stages blocked.');if(!approve){finishRun('rejected');return}r.status='running';advanceRun(runToken)}
function runStats(){const states=Object.values(state.runtime?.states||{});return [['Done',states.filter(x=>x==='completed').length],['In progress',states.filter(x=>x==='active'||x==='waiting').length],['Remaining',states.filter(x=>x==='pending').length||(!state.runtime?state.nodes.length:0)]]}
function runStatusText(){return ({running:'Running fixture',waiting:'Waiting for human approval',completed:'Completed locally',failed:'Exception detected',rejected:'Rejected',stopped:'Stopped'})[state.runtime?.status]||'Ready to simulate'}
function traceList(r){return `<div class="v3trace">${r?.history?.length?r.history.slice().reverse().map(x=>`<div>${ic(x.status==='completed'?'check':x.status==='waiting'?'clock':x.status==='failed'||x.status==='rejected'?'alert':'activity',14)}<span><b>${esc(x.node)}</b><br/>${esc(x.message)}</span><time>${esc(x.time)}</time></div>`).join(''):'<div>No run events yet.</div>'}</div>`}
testingPage=function(){const r=getRuntime(),busy=r?.status==='running'||r?.status==='waiting',stats=runStats(),done=stats[0][1];return `<main class="page wide">${pageHead('Testing Studio','Watch the workflow execute, inspect agent activity and authorize simulated human gates.',busy?actionButton('Stop simulation','stop-run','',false):actionButton('Run simulation','test'))}<div class="v3split"><section class="v3dark"><div class="v3run-head"><div><h3>Execution graph</h3><p>${esc(runStatusText())} · ${esc(r?.id||'No run started')}</p></div><div class="v3signal"><i></i><span style="font-size:10px">LOCAL PLAYBACK</span></div></div>${networkGraph(state.nodes,{playback:true,interactive:false})}<div class="v3live-legend"><span><i></i> Running</span><span><i></i> Complete</span><span><i></i> Human decision</span></div><div class="v3statusbar">${stats.map(([n,v])=>`<div><b>${v}</b><span>${n}</span></div>`).join('')}</div></section><section class="v3panel"><div class="v3run-head"><div><h3>Execution stages</h3><p>${done}/${state.nodes.length} stages completed</p></div><span class="pill ${r?.status==='completed'?'green':r?.status==='waiting'||r?.status==='failed'?'amber':'blue'}">${esc(runStatusText())}</span></div><div class="v3progress"><b style="width:${done/Math.max(1,state.nodes.length)*100}%"></b></div>${stepList(state.nodes,true)}${r?.status==='waiting'?`<div class="v3gate"><h3>Human approval required</h3><p>${esc(state.nodes[r.current]?.name)} must be reviewed before the next stage.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost small" data-action="run-reject">Reject</button><button class="btn primary small" data-action="run-approve">Approve & continue</button></div></div>`:''}${!busy?`<div class="v3scene"><label style="font-size:11px"><input type="checkbox" id="simulateFailure" ${state.test.fail?'checked':''}> Inject an exception at stage 4</label><p>Local fixture only. External calls and approvals are not executed.</p></div>`:''}${r?.status==='completed'?`<div class="v3actionrow">${actionButton('Prepare deployment','goto','deploy')}</div>`:''}</section></div><div class="v3section v3panel"><h3>Agent and workflow activity</h3><p>Chronological trace from this simulation (latest first).</p>${traceList(r)}</div></main>`};

prepareRelease=function(){if(state.runtime?.status!=='completed'){toast('Complete a successful local workflow simulation before preparing a release.');return}const s=currentScenario();state.release={solution:s.name,version:'0.2.0-local',target:state.deployTarget,workflow:clone(state.nodes.map(({id,name,type,detail})=>({id,name,type,binding:detail}))),agentBindings:agentBindings(),knowledge:s.knowledge.map(x=>x[0]),integrations:s.integrations.map(x=>({name:x[0],credential:'Configure securely on target'})),execution:'local fixture validated',artifacts:['workflow-definition','agent-binding-references','connector-contracts','knowledge-references','deployment-config'],generatedAt:new Date().toISOString(),note:'Illustrative configuration manifest, not runnable container images or a production deployment.'};saveProject();render();toast('Local release manifest prepared.')};
