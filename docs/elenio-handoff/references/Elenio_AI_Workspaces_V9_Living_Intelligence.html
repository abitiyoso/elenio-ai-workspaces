const oldImport=importTemplate;importTemplate=function(e){const f=e.target.files?.[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{const obj=JSON.parse(reader.result),id='imported-'+Date.now(),raw=Array.isArray(obj.nodes)?obj.nodes:[];const nodes=raw.slice(0,24).map((n,i)=>({id:'imported-'+i,name:String(n.name||n.label||n.type||'Step '+(i+1)).slice(0,100),type:kinds[n.type]?n.type:'logic',detail:String(n.binding||n.detail||'Needs mapping').slice(0,150)}));state.templateNodes[id]=nodes;state.imported.unshift({title:String(obj.name||obj.title||f.name.replace('.json','')),desc:'Imported JSON preview · manual mapping required',id,category:'Imported',color:'blue',nodes:nodes.length,agents:nodes.filter(x=>x.type==='agent').length});state.modal=null;go('templates');toast('Imported local template. Compatibility requires manual validation.')}catch{toast('Invalid JSON.')}};reader.readAsText(f)};

handleIntent=function(e){const el=e.target.closest('[data-action]');if(!el)return;const k=el.dataset.action,id=el.dataset.id;switch(k){case 'goto':if(id==='architect'&&!state.hasBlueprint&&state.chat.length===0){state.blueprintTab='Blueprint'}go(id);return;

case 'build':if(!state.hasBlueprint){toast('Describe a requirement first.');return}go('studio');return;
case 'blueprint-tab':state.blueprintTab=id;render();return;
case 'agent-tab':state.agentTab=id;state.agentProbe=null;render();return;
case 'graph-node':state.selectedNode=id;go('studio');return;
case 'select-node':state.selectedNode=id;render();return;
case 'quick-node':appendNode(id);go('studio');return;
case 'bind-agent':{const a=state.agents[Number(id)];if(a){appendNode('agent',a.name,a.name);go('studio')}return}
case 'save-node':{const n=state.nodes.find(x=>x.id===state.selectedNode),name=document.getElementById('v3nodeName')?.value.trim(),binding=document.getElementById('v3nodeBinding')?.value.trim();if(n&&name){n.name=name;n.detail=binding||'Configure capability';invalidate();render();toast('Node saved.')}return}
case 'remove-node':if(state.nodes.length<=1){toast('Keep at least one workflow node.');return}state.nodes=layoutNodes(state.nodes.filter(n=>n.id!==id));state.selectedNode=state.nodes[0]?.id;invalidate();render();return;
case 'reflow':state.nodes=layoutNodes(state.nodes);render();return;
case 'architect-quick':applyRefinement(id==='approval'?'Add mandatory human approval before output.':id==='local'?'Use a customer-hosted deployment.':'Reuse existing capabilities.');return;
case 'test':runTest();return;case 'stop-run':stopRun();return;case 'run-approve':decideRun(true);return;case 'run-reject':decideRun(false);return;
case 'inspect-run':state.inspectRun=id;state.modal='inspect-run';render();return;
case 'deploy-target':state.deployTarget=id;state.release=null;saveProject();render();return;
case 'release':prepareRelease();return;
case 'template':state.previewTemplate=id;state.modal='template-preview';render();return;
case 'clone-template':{if(state.runtime?.status==='running'||state.runtime?.status==='waiting'){toast('Stop the active simulation first.');return}const tm=[...TEMPLATES,...state.imported].find(x=>x.id===id);if(!tm)return;let sc=scenarios[id],ns=sc?makeNodes(id):state.templateNodes[id];let key=makeCustom(tm.title+' · new solution',sc?.request||tm.desc,ns?.length?ns:makeNodes('generic'));if(sc)scenarios[key]={...clone(sc),key,name:tm.title+' · new solution'};state.modal=null;startArchitect(scenarios[key].request,key);return}
case 'inspect-knowledge':state.modal='knowledge-'+id;render();return;
case 'collection-upload':document.getElementById('v3KnowledgeInput')?.click();return;
case 'knowledge-upload':state.modal='knowledge-0';render();return;
case 'bind-connector':{let i=connectorIndex(id);if(i<0){state.connectors.push({name:id,desc:'Project dependency. Define endpoint and authentication policy.',category:'Project integration',icon:'plug',status:'Configure'});i=state.connectors.length-1}state.modal='connector-'+i;render();return}case 'save-connector':{const a=state.connectors[Number(id)],ep=document.getElementById('connectorEndpoint')?.value.trim();if(!ep){toast('Enter a non-secret endpoint.');return}try{const u=new URL(ep);if(u.username||u.password||u.search||u.hash){toast('Use a clean endpoint with no authentication or query data.');return}}catch{toast('Enter a valid endpoint URL.');return}state.localConfig[a.name]={endpoint:ep,auth:document.getElementById('connectorAuth').value};a.status='Defined locally';state.modal=null;render();toast('Connector definition saved. Connection not tested.');return}
case 'probe-agent':{const input=document.getElementById('probeText')?.value.trim();if(!input){toast('Enter a sample task.');return}const a=state.agents[state.selectedAgent];state.agentProbe=`${a.name} received a ${input.length}-character fixture. Assigned skills: ${a.skills.join(', ')||'none'}. Expected output: structured result with evidence and review status. No model inference was performed.`;render();return}
case 'select-agent':state.selectedAgent=Number(id);state.agentProbe=null;render();return;
case 'modal-submit':if(state.modal==='new-solution'){const name=document.getElementById('modalName')?.value.trim(),req=document.getElementById('modalDesc')?.value.trim();if(!name){toast('Enter a solution name.');return}state.modal=null;const key=makeCustom(name,req||name);startArchitect(req||name,key);return}if(state.modal==='add-node'){const name=document.getElementById('modalName')?.value.trim();if(!name){toast('Enter a node name.');return}appendNode(document.getElementById('modalKind').value,name);state.modal=null;go('studio');return}break;
}return baseIntent(e)};

function v7art(type='agent',seed='a'){const colors=v7palette[type]||v7palette.agent;const id='a'+String(seed).replace(/[^a-z0-9]/gi,'')+'_'+type;const [deep,mid,pale]=colors;let shape='';const g=`url(#${id}g)`;const g2=`url(#${id}h)`;if(type==='knowledge'){shape=`<g transform="rotate(-13 60 60)">${[17,9,0].map((y,i)=>`<path d="M32 ${39+y} L75 ${24+y} L94 ${43+y} L51 ${59+y} Z" fill="${i===2?g:g2}" stroke="${deep}" stroke-opacity=".2"/><path d="M51 ${59+y} L94 ${43+y} V${50+y} L51 ${66+y} L32 ${46+y} V${39+y}Z" fill="${deep}" opacity="${.24+i*.14}"/>`).join('')}</g>`}else if(type==='people'){shape=`<g transform="rotate(-10 60 60)"><rect x="30" y="26" width="61" height="70" rx="15" fill="${g}" stroke="#fff" stroke-opacity=".85"/><circle cx="60" cy="48" r="12" fill="${g2}"/><path d="M42 75 Q44 60 60 60 Q76 60 79 75Z" fill="${g2}"/><path d="M48 83 H71" stroke="#fff" stroke-opacity=".9" stroke-width="3" stroke-linecap="round"/></g>`}else if(type==='approval'){shape=`<path d="M60 23 L88 34 V59 Q86 81 60 94 Q34 81 32 59 V34Z" fill="${g}" stroke="#fff" stroke-opacity=".8"/><path d="M60 35 L77 42 V58 Q76 72 60 82 Q44 72 43 58 V42Z" fill="${g2}"/><path d="M48 57 l9 9 17-19" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>`}else if(type==='api'){shape=`<g transform="rotate(-35 60 60)"><rect x="24" y="38" width="43" height="30" rx="12" fill="none" stroke="${g}" stroke-width="12"/><rect x="54" y="52" width="43" height="30" rx="12" fill="none" stroke="${g2}" stroke-width="12"/><path d="M44 54 H76" stroke="${deep}" stroke-width="6" stroke-linecap="round"/></g>`}else if(type==='logic'){shape=`<g transform="rotate(-20 60 60)"><ellipse cx="60" cy="60" rx="33" ry="17" fill="none" stroke="${g}" stroke-width="13"/><ellipse cx="60" cy="60" rx="17" ry="33" fill="none" stroke="${g2}" stroke-width="12"/><circle cx="60" cy="60" r="11" fill="${g}" stroke="white" stroke-opacity=".5"/></g>`}else{shape=`<circle cx="60" cy="60" r="30" fill="${g}" stroke="#fff" stroke-opacity=".75"/><ellipse cx="60" cy="60" rx="38" ry="14" transform="rotate(-32 60 60)" fill="none" stroke="${g2}" stroke-width="8"/><circle cx="84" cy="38" r="6" fill="${deep}" stroke="white" stroke-width="1.2"/>`};return `<svg viewBox="0 0 120 120" class="v7art" aria-hidden="true"><defs><linearGradient id="${id}g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".35" stop-color="${mid}"/><stop offset="1" stop-color="${deep}"/></linearGradient><linearGradient id="${id}h" x1="0" y1="0" x2="1" y2="1"><stop stop-color="${pale}"/><stop offset="1" stop-color="${deep}"/></linearGradient><radialGradient id="${id}s"><stop stop-color="${deep}" stop-opacity=".24"/><stop offset="1" stop-color="${deep}" stop-opacity="0"/></radialGradient></defs><ellipse cx="60" cy="99" rx="40" ry="10" fill="url(#${id}s)"/><circle cx="60" cy="60" r="45" fill="none" stroke="${deep}" stroke-opacity=".11" stroke-dasharray="2 5"/>${shape}</svg>`}
