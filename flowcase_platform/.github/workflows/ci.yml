name: ci
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: flowcase
          POSTGRES_USER: flowcase
          POSTGRES_PASSWORD: flowcase-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U flowcase -d flowcase"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make lint
      - run: make test-integration
        env:
          FLOWCASE_TEST_DATABASE_URL: postgres://flowcase:flowcase-ci-only@localhost:5432/flowcase?sslmode=disable
      - name: Migrations apply to a clean database
        run: go run ./cmd/migrate up && go run ./cmd/migrate status
        env:
          DATABASE_URL: postgres://flowcase:flowcase-ci-only@localhost:5432/flowcase?sslmode=disable

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
