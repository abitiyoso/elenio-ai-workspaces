# Tailnet-only development deployment (kibi-vm), mirroring the KMS VM setup.
# APP_ENV=development + dev mock identity because the host token contract is still pending
# (docs/CONTRACTS.md). The web UI binds only to the Tailscale address; Postgres is not published.
name: flowcase

x-app-env: &app_env
  APP_ENV: development
  LOG_LEVEL: info
  DATABASE_URL: postgres://flowcase:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/flowcase?sslmode=disable
  AUTH_MODE: dev_mock
  DEV_AUTH_ACKNOWLEDGE: i-understand-this-is-not-secure
  DEV_AUTH_USER_ID: 00000000-0000-4000-8000-000000000101
  DEV_AUTH_TENANT_ID: 00000000-0000-4000-8000-000000000001
  DEV_AUTH_DISPLAY_NAME: Local Developer
  DEV_AUTH_ROLES: ${DEV_AUTH_ROLES:-workspace_member,case_owner,workflow_designer,workflow_publisher}
  DEV_AUTH_PERSONAS: '[{"key":"approver","user_id":"00000000-0000-4000-8000-000000000102","name":"Dian Approver","roles":["workspace_member","domain_approver"]},{"key":"viewer","user_id":"00000000-0000-4000-8000-000000000103","name":"Vera Viewer","roles":["workspace_member"]}]'
  KMS_MODE: stub
  AGENT_RUNTIME_MODE: stub
  CONNECTORS_MODE: stub
  AGENT_CALLBACK_SECRET: ${AGENT_CALLBACK_SECRET:-}
  PACKS_CONFIG: /app/config/packs.json

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: flowcase
      POSTGRES_USER: flowcase
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowcase -d flowcase"]
      interval: 3s
      timeout: 3s
      retries: 30

  migrate:
    build: .
    image: flowcase-backend:latest
    command: ["/app/migrate", "up"]
    environment: *app_env
    volumes: ["./config:/app/config:ro"]
    depends_on:
      postgres: { condition: service_healthy }

  seed-dev:
    image: flowcase-backend:latest
    command: ["/app/migrate", "seed-dev"]
    environment: *app_env
    volumes: ["./config:/app/config:ro"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  api:
    image: flowcase-backend:latest
    command: ["/app/api"]
    restart: unless-stopped
    environment:
      <<: *app_env
      HTTP_ADDRESS: ":8080"
      METRICS_ADDRESS: ":9090"
    volumes: ["./config:/app/config:ro"]
    ports: ["127.0.0.1:${FLOWCASE_API_PORT:-8180}:8080", "127.0.0.1:${FLOWCASE_METRICS_PORT:-9180}:9090"]
    depends_on:
      seed-dev: { condition: service_completed_successfully }

  worker:
    image: flowcase-backend:latest
    command: ["/app/worker"]
    restart: unless-stopped
    environment:
      <<: *app_env
      WORKER_HEALTH_ADDRESS: ":8081"
    volumes: ["./config:/app/config:ro"]
    ports: ["127.0.0.1:${FLOWCASE_WORKER_PORT:-9181}:8081"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    build: ./web
    restart: unless-stopped
    ports: ["${FLOWCASE_BIND_IP:?set in .env}:${FLOWCASE_WEB_PORT:-5180}:8080"]
    depends_on: [api]

volumes:
  postgres_data:
